<text x="160.0" y="959.6" font-family='"Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif' font-size="32px" font-weight="600" letter-spacing="4.48px" fill="rgb(78, 71, 63)" xml:space="preserve">AND FROM THE TRADITIONS</text>
<text x="83.6" y="1026.6" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="60px" font-weight="700" fill="rgb(155, 44, 44)" xml:space="preserve">4</text>
