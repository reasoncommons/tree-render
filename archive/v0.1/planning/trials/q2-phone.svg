<text x="72.0" y="251.0" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="84px" font-weight="700" letter-spacing="-1.26px" fill="rgb(30, 26, 22)" xml:space="preserve">Go at the speed</text>
<text x="72.0" y="335.0" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="84px" font-weight="700" letter-spacing="-1.26px" fill="rgb(30, 26, 22)" xml:space="preserve">of wisdom.</text>
<text x="72.0" y="392.0" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="36px" font-weight="400" fill="rgb(30, 26, 22)" xml:space="preserve">Pace AI to the speed at which we can understand, verify</text>
<text x="72.0" y="435.9" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="36px" font-weight="400" fill="rgb(30, 26, 22)" xml:space="preserve">and govern it.</text>
<text x="72.0" y="487.8" font-family='"Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif' font-size="32px" font-weight="600" letter-spacing="3.2px" fill="rgb(155, 44, 44)" xml:space="preserve">BECAUSE</text>
<text x="249.4" y="487.8" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="36px" font-weight="400" font-style="italic" fill="rgb(78, 71, 63)" xml:space="preserve">catastrophe would be permanent, while most of</text>
<text x="72.0" y="531.8" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="36px" font-weight="400" font-style="italic" fill="rgb(78, 71, 63)" xml:space="preserve">what delay costs can be recovered.</text>
<text x="83.6" y="612.8" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="60px" font-weight="700" fill="rgb(155, 44, 44)" xml:space="preserve">1</text>
<text x="160.0" y="596.8" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="34px" font-weight="700" fill="rgb(30, 26, 22)" xml:space="preserve">The risks are real</text>
