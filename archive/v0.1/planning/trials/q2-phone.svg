<text x="72.0" y="1214.0" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="36px" font-weight="400" fill="rgb(245, 240, 230)" xml:space="preserve">should push AI towards the speed of wisdom, each with its</text>
