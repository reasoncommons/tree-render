<text x="160.0" y="809.6" font-family='"Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif' font-size="32px" font-weight="600" letter-spacing="4.48px" fill="rgb(155, 44, 44)" xml:space="preserve">EVEN SO</text>
<text x="83.6" y="874.6" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="60px" font-weight="700" fill="rgb(155, 44, 44)" xml:space="preserve">3</text>
<text x="160.0" y="858.6" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="34px" font-weight="700" fill="rgb(30, 26, 22)" xml:space="preserve">We should slow and steer,</text>
<text x="577.4" y="858.6" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="34px" font-weight="400" fill="rgb(78, 71, 63)" xml:space="preserve">we partly can, and far more</text>
