<text x="160.0" y="1052.0" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="34px" font-weight="400" fill="rgb(78, 71, 63)" xml:space="preserve">strongest on will and process; they offer only modest</text>
<text x="160.0" y="1093.5" font-family='Charter, "Iowan Old Style", Georgia, serif' font-size="34px" font-weight="400" fill="rgb(78, 71, 63)" xml:space="preserve">help on mechanisms.</text>
<text x="72.0" y="1170.0" font-family='"Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif' font-size="32px" font-weight="600" letter-spacing="3.2px" fill="rgb(233, 201, 168)" xml:space="preserve">SO</text>
