<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d">
<title id="t">Go at the speed of wisdom: how fast should we develop AI?</title>
<desc id="d">Poster. How fast should we develop AI? Go at the speed of wisdom: pace AI to the speed at which we can understand, verify and govern it. Because catastrophe would be permanent, while most of what delay costs can be recovered. 1 The risks are real and contested, and the uncertainty itself calls for caution. Yet 2 the world races because it is caught in a collective action trap. Even so, 3 we should slow and steer, we partly can, and far more people should decide. From the traditions: 4 wisdom traditions point towards restraint and are strongest on will and process, with only modest help on mechanisms. So: every actor, labs, states, communities and individuals, should push AI towards the speed of wisdom, each with its own lever. Rufus Pollock, Wise AI briefing, draft, October 2026.</desc>
