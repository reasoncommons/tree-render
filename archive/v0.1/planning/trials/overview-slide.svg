<title id="t">Wise AI: four questions and their answers</title>
<desc id="d">Overview slide. Question: How should we approach the development of AI wisely, and what do wisdom traditions offer? Drafted answer: We can only partly make AI good, so go at the speed of wisdom, keep AI a servant, and stay humble about its inner life. Four columns. Q1 Alignment: Can we make AI good? Partly, and not yet in a way anyone can check. Traditions offer the target and a model of formation, not a technical fix. Q2 Risk and pace: If we can't be sure, how fast should we go? Go at the speed of wisdom: slow the frontier, speed up safety. Traditions offer a clear direction towards restraint and the will to act; little on mechanisms. Q3 Broader impacts: Setting catastrophe aside, how should we live with AI? AI's deepest effect is on our capacity to choose well; keep it a servant. Traditions offer practices of consumption and stopping, standards of speech and friendship, and community. Q4 Consciousness, minor: Could AI feel? We do not know and may never; relate with humility, low-cost care and clear honesty. Traditions offer a better question: is there feeling that can suffer? Rufus Pollock, Wise AI briefing, draft, October 2026.</desc>
