    # ── Goal (from the Question and its criteria) ─────────────────────────
    - id: g-e-trees-become-good-visuals
      tree: goal
      statement: Any question or hypothesis tree is turned reliably and quickly into a visual that is good information design and compelling enough to share, for both thinking together and sharing publicly.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L33" }
    - id: g-e-good-enough-to-post
      tree: goal
      statement: Each visual is good enough to post or put in front of the team as it is, better than "okay".
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L37" }
    - id: g-e-fifteen-minutes-per-visual
      tree: goal
      statement: A new visual takes about 15 minutes of AI work and 5 minutes or less of human input, and regenerates quickly when the tree changes (a guess).
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L38" }
    - id: g-e-compelling-to-share
      tree: goal
      statement: A tree visual is compelling enough that people share it as it is.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L33" }
    - id: g-e-usable-for-thinking
      tree: goal
      statement: A tree visual is a usable view for thinking together on the web or a phone.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L24" }
    - id: g-e-team-first-audience
      tree: goal
      statement: The visuals serve Rufus and the Life Itself team first, and the people they share with.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L36" }

    # ── Current reality (Situation and Complication) ─────────────────────
    - id: r-e-we-generate-trees
      tree: current_reality
      statement: The team generates question trees and hypothesis trees that mirror them, one assertion per node.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L11" }
    - id: r-e-bullets-most-editable
      tree: current_reality
      statement: Nested bullets are the most editable structure for a tree.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L12" }
    - id: r-e-default-is-bullets
      tree: current_reality
      statement: The default form for reading a tree is nested bullets in Markdown or a Google Doc.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L12" }
    - id: r-e-folding-unused
      tree: current_reality
      statement: Most people do not use the list folding their editors offer.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L13" }
    - id: r-e-bullets-poor-design
      tree: current_reality
      statement: Bullet trees are poor information design and are neither visually nor socially compelling, for every reader.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L19" }
    - id: r-e-subbranches-push-out
      tree: current_reality
      statement: In a bullet tree the first branch's sub-branches push the second branch out of view.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L20" }
    - id: r-e-reader-misses-shape
      tree: current_reality
      statement: An attentive reader of a bullet tree misses its top-level shape and obvious main points.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L20" }
    - id: r-e-bullets-overwhelm
      tree: current_reality
      statement: A bullet tree shows everything at once and overwhelms the reader.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L21" }
    - id: r-e-bullets-not-shared
      tree: current_reality
      statement: Nobody shares a screenshot of a bullet tree.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L22" }
    - id: r-e-mindmaps-get-shared
      tree: current_reality
      statement: A beautiful mindmap of a thesis gets shared on social media.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L22" }
    - id: r-e-no-reliable-way
      tree: current_reality
      statement: There is no reliable, quick way to make a better visual of a tree.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L23" }
    - id: r-e-hand-judgment
      tree: current_reality
      statement: Each tree visual takes hand judgment to make.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L23" }
    - id: r-e-results-only-okay
      tree: current_reality
      statement: Tree visuals made so far are only okay.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L23" }
    - id: r-e-uses-pull-apart
      tree: current_reality
      statement: Sharing and thinking together need different density and interactivity from a tree visual.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L24" }
    - id: r-e-design-choices-unresolved
      tree: current_reality
