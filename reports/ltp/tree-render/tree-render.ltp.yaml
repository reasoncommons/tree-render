      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L30" }
    - id: r-e-audiences-differ
      tree: current_reality
      statement: Audiences for tree visuals differ in taste, from calm/editorial to engineering to fun and funky.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L30" }
    - id: r-e-posters-rejected
      tree: current_reality
      statement: Block and poster layouts were rejected in the trials of 2026-10-17 to 19.
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L14" }
    - id: r-e-mindmaps-okay
      tree: current_reality
      statement: Static left-to-right mindmaps in the Seeds of Renaissance style, rendered by an AI skill from a small JSON file, were judged "okay, not yet good".
      provenance: { path: "docs/plans/2026-10-19-tree-render-scq.md#L14" }

