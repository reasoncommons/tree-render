  assumptions:
    # Candidate assumptions drawn from the SCQ's open issue-tree questions.
    # Each restates the belief the question puts in doubt. None is the author's
    # assertion; see the report.
    - { id: c-asm-shared-is-static, relationship_id: c-rel-densities-conflict, statement: A visual made for sharing has to be a static image with no interactivity. }
    - { id: c-asm-one-visual-per-use, relationship_id: c-rel-densities-conflict, statement: One visual cannot serve both uses, for example by folding or by being cropped from a fuller view. }
