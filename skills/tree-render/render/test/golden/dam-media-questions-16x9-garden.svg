<g class="node" data-num="root" data-depth="0" transform="translate(0,330.9)"><text y="27.7" font-size="33" font-family="ApfelMittel" fill="#1A1A1A">How should Life Itself make</text><text y="64.7" font-size="33" font-family="ApfelMittel" fill="#1A1A1A">its strong existing images</text><text y="101.6" font-size="33" font-family="ApfelMittel" fill="#1A1A1A">and video quick to find</text><text y="138.6" font-size="33" font-family="ApfelMittel" fill="#1A1A1A">and reuse for the people</text><text y="175.6" font-size="33" font-family="ApfelMittel" fill="#1A1A1A">building pages and doing</text><text y="212.5" font-size="33" font-family="ApfelMittel" fill="#1A1A1A">comms, without relying on</text><text y="249.5" font-size="33" font-family="ApfelMittel" fill="#1A1A1A">tagging at capture?</text></g>
<g class="node" data-num="1" data-depth="1" transform="translate(601.4,0)"><text y="32" font-size="36" font-family="ApfelMittel" fill="#1A1A1A">Is finding media actually a real</text><text y="76" font-size="36" font-family="ApfelMittel" fill="#1A1A1A">constraint on site and comms</text><text y="119.9" font-size="36" font-family="ApfelMittel" fill="#1A1A1A">work, and where does it bite?</text></g>
<g class="node" data-num="2" data-depth="1" transform="translate(601.4,162.9)"><text y="32" font-size="36" font-family="ApfelMittel" fill="#1A1A1A">Who does the hunting today, and</text><text y="76" font-size="36" font-family="ApfelMittel" fill="#1A1A1A">what do they need in practice?</text></g>
<g class="node" data-num="2.1" data-depth="2" transform="translate(1203.5,173)"><text y="24.4" font-size="27" fill="#1A1A1A">Which live pages and comms pieces</text><text y="58.2" font-size="27" fill="#1A1A1A">need what media first (Hubs site first)?</text></g>
<g class="node" data-num="3" data-depth="1" transform="translate(601.4,281.8)"><text y="32" font-size="36" font-family="ApfelMittel" fill="#1A1A1A">Where does our material</text><text y="76" font-size="36" font-family="ApfelMittel" fill="#1A1A1A">live today? (Drive partly</text><text y="119.9" font-size="36" font-family="ApfelMittel" fill="#1A1A1A">surveyed in Sept)</text></g>
<g class="node" data-num="3.1" data-depth="2" transform="translate(1203.5,314)"><text y="24.4" font-size="27" fill="#1A1A1A">Who knows or controls each location, and</text><text y="58.2" font-size="27" fill="#1A1A1A">who can actually get material out for us?</text></g>
<g class="node" data-num="4" data-depth="1" transform="translate(601.4,463)"><text y="32" font-size="36" font-family="ApfelMittel" fill="#1A1A1A">Should findable material be</text><text y="76" font-size="36" font-family="ApfelMittel" fill="#1A1A1A">moved into one archive, or</text><text y="119.9" font-size="36" font-family="ApfelMittel" fill="#1A1A1A">pointed to where it already lives?</text></g>
