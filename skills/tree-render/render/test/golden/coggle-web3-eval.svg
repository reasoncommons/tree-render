<g class="label" data-node="root" fill="#414141" font-size="17">
<text x="0" y="-84.5" text-anchor="middle" xml:space="preserve"><tspan>[Web3] What is the evaluation of the various</tspan></text>
<text x="0" y="-64.5" text-anchor="middle" xml:space="preserve"><tspan>claims (+ve or -ve) for web3/crypto (and the</tspan></text>
<text x="0" y="-44.5" text-anchor="middle" xml:space="preserve"><tspan>supporting reasoning/sensemaking) so that …</tspan></text>
<text x="0" y="-24.5" text-anchor="middle" xml:space="preserve"><tspan>we (collectively as individuals, societies etc)</tspan></text>
<text x="0" y="-4.5" text-anchor="middle" xml:space="preserve"><tspan>make good choices te the technology</tspan></text>
<text x="0" y="15.5" text-anchor="middle" xml:space="preserve"><tspan>(whether to support, improve or curb) and</tspan></text>
<text x="0" y="35.5" text-anchor="middle" xml:space="preserve"><tspan>allocate our resources (attention, energy,</tspan></text>
<text x="0" y="55.5" text-anchor="middle" xml:space="preserve"><tspan>money) effectively and this all happens in as a</tspan></text>
<text x="0" y="75.5" text-anchor="middle" xml:space="preserve"><tspan>constructive, intersectional and (de-polarizing)</tspan></text>
<text x="0" y="95.5" text-anchor="middle" xml:space="preserve"><tspan>way as possible?</tspan></text>
</g>
<g class="label" data-node="1" fill="#82348c" font-size="15.3" filter="url(#cg-halo)">
<text x="784" y="-368.75" text-anchor="end" xml:space="preserve"><tspan>What are the core high level</tspan></text>
<text x="784" y="-350.75" text-anchor="end" xml:space="preserve"><tspan>problems/aspirations/hopes</tspan></text>
<text x="784" y="-332.75" text-anchor="end" xml:space="preserve"><tspan>that crypto/web3 movement</tspan></text>
<text x="784" y="-314.75" text-anchor="end" xml:space="preserve"><tspan>talks to ...</tspan></text>
</g>
<g class="label" data-node="1.1" fill="#82328c" font-size="15.3">
<text x="851.72" y="-331.25" text-anchor="start" xml:space="preserve"><tspan>What is an inventory of these aspirations and what</tspan></text>
<text x="851.72" y="-313.25" text-anchor="start" xml:space="preserve"><tspan>are the most important?</tspan></text>
</g>
<g class="label" data-node="1.2" fill="#7e3388" font-size="15.3">
<text x="851.72" y="-280.25" text-anchor="start" xml:space="preserve"><tspan>What are the political imaginaries/ideologies that</tspan></text>
<text x="851.72" y="-262.25" text-anchor="start" xml:space="preserve"><tspan>relate to this?</tspan></text>
</g>
<g class="label" data-node="2" fill="#2e4e81" font-size="15.3" filter="url(#cg-halo)">
<text x="784" y="-224.75" text-anchor="end" xml:space="preserve"><tspan>What is our evaluation i.e.</tspan></text>
<text x="784" y="-206.75" text-anchor="end" xml:space="preserve"><tspan>how would crypto/web3</tspan></text>
<text x="784" y="-188.75" text-anchor="end" xml:space="preserve"><tspan>address those aspirations,</tspan></text>
<text x="784" y="-170.75" text-anchor="end" xml:space="preserve"><tspan>how else could they be</tspan></text>
<text x="784" y="-152.75" text-anchor="end" xml:space="preserve"><tspan>addressed (outside web3</tspan></text>
<text x="784" y="-134.75" text-anchor="end" xml:space="preserve"><tspan>etc), and what are the risks</tspan></text>
<text x="784" y="-116.75" text-anchor="end" xml:space="preserve"><tspan>of web3 / crypto?</tspan></text>
</g>
<g class="label" data-node="2.1" fill="#2d4c7e" font-size="15.3">
<text x="852.08" y="-184.25" text-anchor="start" xml:space="preserve"><tspan>What is the matrix of +ve claims for web3/crypto vs</tspan></text>
<text x="852.08" y="-166.25" text-anchor="start" xml:space="preserve"><tspan>aspirations?</tspan></text>
</g>
<g class="label" data-node="2.2" fill="#2c4d82" font-size="15.3">
<text x="852.08" y="-133.25" text-anchor="start" xml:space="preserve"><tspan>What is the evaluation of these claims?</tspan></text>
</g>
<g class="label" data-node="2.3" fill="#2d4c7e" font-size="15.3">
<text x="852.08" y="-100.25" text-anchor="start" xml:space="preserve"><tspan>What are the other (non web3) ways of addressing</tspan></text>
<text x="852.08" y="-82.25" text-anchor="start" xml:space="preserve"><tspan>those aspirations ...?</tspan></text>
</g>
<g class="label" data-node="2.4" fill="#2f4e7f" font-size="15.3">
<text x="852.08" y="-49.25" text-anchor="start" xml:space="preserve"><tspan>What are the risks of the web3 movement (beyond</tspan></text>
<text x="852.08" y="-31.25" text-anchor="start" xml:space="preserve"><tspan>not fulfilling on its aspirations and the opportunity</tspan></text>
<text x="852.08" y="-13.25" text-anchor="start" xml:space="preserve"><tspan>cost of that)?</tspan></text>
</g>
<g class="label" data-node="3" fill="#2f7065" font-size="15.3" filter="url(#cg-halo)">
<text x="784" y="141.25" text-anchor="end" xml:space="preserve"><tspan>What key background ideas</tspan></text>
<text x="784" y="159.25" text-anchor="end" xml:space="preserve"><tspan>are needed / relevant?</tspan></text>
</g>
<g class="label" data-node="3.1" fill="#2f7468" font-size="13">
<text x="851.3" y="62.25" text-anchor="start" xml:space="preserve"><tspan>What do we mean by key terms?</tspan></text>
</g>
<g class="label" data-node="3.2" fill="#306c62" font-size="13">
<text x="851.3" y="92.25" text-anchor="start" xml:space="preserve"><tspan>What political theory / science?</tspan></text>
</g>
<g class="label" data-node="3.3" fill="#307569" font-size="13">
<text x="851.3" y="122.25" text-anchor="start" xml:space="preserve"><tspan>What economics and game theory?</tspan></text>
</g>
<g class="label" data-node="3.4" fill="#2f766a" font-size="13">
<text x="851.3" y="152.25" text-anchor="start" xml:space="preserve"><tspan>What macroeconomics?</tspan></text>
</g>
<g class="label" data-node="3.5" fill="#2e6f64" font-size="13">
<text x="851.3" y="182.25" text-anchor="start" xml:space="preserve"><tspan>What computer science?</tspan></text>
</g>
<g class="label" data-node="4" fill="#4f6f31" font-size="15.3" filter="url(#cg-halo)">
<text x="784" y="337.75" text-anchor="end" xml:space="preserve"><tspan>How does this contribute to</tspan></text>
<text x="784" y="355.75" text-anchor="end" xml:space="preserve"><tspan>wider sensemaking?</tspan></text>
</g>
<g class="label" data-node="4.1" fill="#4e6f30" font-size="13.8134">
<text x="851.64" y="258.25" text-anchor="start" xml:space="preserve"><tspan>Why has crypto/web3 (narrative) been so attractive</tspan></text>
<text x="851.64" y="274.25" text-anchor="start" xml:space="preserve"><tspan>(successful?)?</tspan></text>
</g>
<g class="label" data-node="4.2" fill="#527333" font-size="13.8134">
<text x="851.64" y="305.25" text-anchor="start" xml:space="preserve"><tspan>How do we share what we are doing?</tspan></text>
</g>
<g class="label" data-node="4.3" fill="#4c6c2f" font-size="13">
<text x="851.64" y="335.25" text-anchor="start" xml:space="preserve"><tspan>How do we involve others in the sensemaking process?</tspan></text>
</g>
<g class="label" data-node="4.4" fill="#517331" font-size="13">
<text x="851.64" y="365.25" text-anchor="start" xml:space="preserve"><tspan>What framework can we use to answer the question of</tspan></text>
<text x="851.64" y="380.25" text-anchor="start" xml:space="preserve"><tspan>whether crypto or web3 is useful and in what way …?</tspan></text>
</g>
</g></svg>
