<g class="label" data-node="root" fill="#414141" font-size="22">
<text x="0" y="-148.5" text-anchor="middle" xml:space="preserve"><tspan>[Web3] What is the evaluation of</tspan></text>
<text x="0" y="-122.5" text-anchor="middle" xml:space="preserve"><tspan>the various claims (+ve or -ve) for</tspan></text>
<text x="0" y="-96.5" text-anchor="middle" xml:space="preserve"><tspan>web3/crypto (and the supporting</tspan></text>
<text x="0" y="-70.5" text-anchor="middle" xml:space="preserve"><tspan>reasoning/sensemaking) so that</tspan></text>
<text x="0" y="-44.5" text-anchor="middle" xml:space="preserve"><tspan>… we (collectively as individuals,</tspan></text>
<text x="0" y="-18.5" text-anchor="middle" xml:space="preserve"><tspan>societies etc) make good choices</tspan></text>
<text x="0" y="7.5" text-anchor="middle" xml:space="preserve"><tspan>te the technology (whether to</tspan></text>
<text x="0" y="33.5" text-anchor="middle" xml:space="preserve"><tspan>support, improve or curb) and</tspan></text>
<text x="0" y="59.5" text-anchor="middle" xml:space="preserve"><tspan>allocate our resources (attention,</tspan></text>
<text x="0" y="85.5" text-anchor="middle" xml:space="preserve"><tspan>energy, money) effectively and</tspan></text>
<text x="0" y="111.5" text-anchor="middle" xml:space="preserve"><tspan>this all happens in as a</tspan></text>
<text x="0" y="137.5" text-anchor="middle" xml:space="preserve"><tspan>constructive, intersectional and</tspan></text>
<text x="0" y="163.5" text-anchor="middle" xml:space="preserve"><tspan>(de-polarizing) way as possible?</tspan></text>
</g>
<g class="label" data-node="1" fill="#82348c" font-size="15.3" filter="url(#cg-halo)">
<text x="585.16" y="-386" text-anchor="end" xml:space="preserve"><tspan>What are the core high level</tspan></text>
<text x="585.16" y="-368" text-anchor="end" xml:space="preserve"><tspan>problems/aspirations/hopes that</tspan></text>
<text x="585.16" y="-350" text-anchor="end" xml:space="preserve"><tspan>crypto/web3 movement talks to ...</tspan></text>
</g>
<g class="label" data-node="1.1" fill="#82328c" font-size="15.3">
<text x="652.88" y="-366.5" text-anchor="start" xml:space="preserve"><tspan>What is an inventory of these aspirations</tspan></text>
<text x="652.88" y="-348.5" text-anchor="start" xml:space="preserve"><tspan>and what are the most important?</tspan></text>
</g>
<g class="label" data-node="1.2" fill="#7e3388" font-size="15.3">
<text x="652.88" y="-315.5" text-anchor="start" xml:space="preserve"><tspan>What are the political imaginaries/ideologies</tspan></text>
<text x="652.88" y="-297.5" text-anchor="start" xml:space="preserve"><tspan>that relate to this?</tspan></text>
</g>
<g class="label" data-node="2" fill="#2e4e81" font-size="15.3" filter="url(#cg-halo)">
<text x="585.16" y="-219.5" text-anchor="end" xml:space="preserve"><tspan>What is our evaluation i.e. how</tspan></text>
<text x="585.16" y="-201.5" text-anchor="end" xml:space="preserve"><tspan>would crypto/web3 address</tspan></text>
<text x="585.16" y="-183.5" text-anchor="end" xml:space="preserve"><tspan>those aspirations, how else</tspan></text>
<text x="585.16" y="-165.5" text-anchor="end" xml:space="preserve"><tspan>could they be addressed</tspan></text>
<text x="585.16" y="-147.5" text-anchor="end" xml:space="preserve"><tspan>(outside web3 etc), and what</tspan></text>
<text x="585.16" y="-129.5" text-anchor="end" xml:space="preserve"><tspan>are the risks of web3 / crypto?</tspan></text>
</g>
<g class="label" data-node="2.1" fill="#2d4c7e" font-size="15.3">
<text x="653.24" y="-197" text-anchor="start" xml:space="preserve"><tspan>What is the matrix of +ve claims for</tspan></text>
<text x="653.24" y="-179" text-anchor="start" xml:space="preserve"><tspan>web3/crypto vs aspirations?</tspan></text>
</g>
<g class="label" data-node="2.2" fill="#2c4d82" font-size="15.3">
<text x="653.24" y="-146" text-anchor="start" xml:space="preserve"><tspan>What is the evaluation of these claims?</tspan></text>
</g>
<g class="label" data-node="2.3" fill="#2d4c7e" font-size="15.3">
<text x="653.24" y="-113" text-anchor="start" xml:space="preserve"><tspan>What are the other (non web3) ways of</tspan></text>
<text x="653.24" y="-95" text-anchor="start" xml:space="preserve"><tspan>addressing those aspirations ...?</tspan></text>
</g>
<g class="label" data-node="2.4" fill="#2f4e7f" font-size="15.3">
<text x="653.24" y="-62" text-anchor="start" xml:space="preserve"><tspan>What are the risks of the web3 movement</tspan></text>
<text x="653.24" y="-44" text-anchor="start" xml:space="preserve"><tspan>(beyond not fulfilling on its aspirations and</tspan></text>
<text x="653.24" y="-26" text-anchor="start" xml:space="preserve"><tspan>the opportunity cost of that)?</tspan></text>
</g>
<g class="label" data-node="3" fill="#2f7065" font-size="15.3" filter="url(#cg-halo)">
<text x="585.16" y="128.5" text-anchor="end" xml:space="preserve"><tspan>What key background ideas are</tspan></text>
<text x="585.16" y="146.5" text-anchor="end" xml:space="preserve"><tspan>needed / relevant?</tspan></text>
</g>
<g class="label" data-node="3.1" fill="#2f7468" font-size="13">
<text x="652.46" y="49.5" text-anchor="start" xml:space="preserve"><tspan>What do we mean by key terms?</tspan></text>
</g>
<g class="label" data-node="3.2" fill="#306c62" font-size="13">
<text x="652.46" y="79.5" text-anchor="start" xml:space="preserve"><tspan>What political theory / science?</tspan></text>
</g>
<g class="label" data-node="3.3" fill="#307569" font-size="13">
<text x="652.46" y="109.5" text-anchor="start" xml:space="preserve"><tspan>What economics and game theory?</tspan></text>
</g>
<g class="label" data-node="3.4" fill="#2f766a" font-size="13">
<text x="652.46" y="139.5" text-anchor="start" xml:space="preserve"><tspan>What macroeconomics?</tspan></text>
</g>
<g class="label" data-node="3.5" fill="#2e6f64" font-size="13">
<text x="652.46" y="169.5" text-anchor="start" xml:space="preserve"><tspan>What computer science?</tspan></text>
</g>
<g class="label" data-node="4" fill="#4f6f31" font-size="15.3" filter="url(#cg-halo)">
<text x="585.16" y="340" text-anchor="end" xml:space="preserve"><tspan>How does this contribute to</tspan></text>
<text x="585.16" y="358" text-anchor="end" xml:space="preserve"><tspan>wider sensemaking?</tspan></text>
</g>
<g class="label" data-node="4.1" fill="#4e6f30" font-size="13.8134">
<text x="653.06" y="245.5" text-anchor="start" xml:space="preserve"><tspan>Why has crypto/web3 (narrative) been so</tspan></text>
<text x="653.06" y="261.5" text-anchor="start" xml:space="preserve"><tspan>attractive (successful?)?</tspan></text>
</g>
<g class="label" data-node="4.2" fill="#527333" font-size="13.8134">
<text x="653.06" y="292.5" text-anchor="start" xml:space="preserve"><tspan>How do we share what we are doing?</tspan></text>
</g>
<g class="label" data-node="4.3" fill="#4c6c2f" font-size="13">
<text x="653.06" y="322.5" text-anchor="start" xml:space="preserve"><tspan>How do we involve others in the</tspan></text>
<text x="653.06" y="337.5" text-anchor="start" xml:space="preserve"><tspan>sensemaking process?</tspan></text>
</g>
<g class="label" data-node="4.4" fill="#517331" font-size="13">
<text x="653.06" y="367.5" text-anchor="start" xml:space="preserve"><tspan>What framework can we use to answer the</tspan></text>
<text x="653.06" y="382.5" text-anchor="start" xml:space="preserve"><tspan>question of whether crypto or web3 is useful and in</tspan></text>
<text x="653.06" y="397.5" text-anchor="start" xml:space="preserve"><tspan>what way …?</tspan></text>
</g>
</g></svg>
