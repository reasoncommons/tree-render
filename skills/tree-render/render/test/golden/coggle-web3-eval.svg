<g class="label" data-node="root" fill="#414141" font-size="22">
<text x="0" y="-148.5" text-anchor="middle" xml:space="preserve"><tspan>[Web3] What is the evaluation of</tspan></text>
<text x="0" y="-122.5" text-anchor="middle" xml:space="preserve"><tspan>the various claims (+ve or -ve) for</tspan></text>
<text x="0" y="-96.5" text-anchor="middle" xml:space="preserve"><tspan>web3/crypto (and the supporting</tspan></text>
<text x="0" y="-70.5" text-anchor="middle" xml:space="preserve"><tspan>reasoning/sensemaking) so that</tspan></text>
<text x="0" y="-44.5" text-anchor="middle" xml:space="preserve"><tspan>… we (collectively as individuals,</tspan></text>
<text x="0" y="-18.5" text-anchor="middle" xml:space="preserve"><tspan>societies etc) make good choices</tspan></text>
<text x="0" y="7.5" text-anchor="middle" xml:space="preserve"><tspan>te the technology (whether to</tspan></text>
<text x="0" y="33.5" text-anchor="middle" xml:space="preserve"><tspan>support, improve or curb) and</tspan></text>
<text x="0" y="59.5" text-anchor="middle" xml:space="preserve"><tspan>allocate our resources (attention,</tspan></text>
<text x="0" y="85.5" text-anchor="middle" xml:space="preserve"><tspan>energy, money) effectively and</tspan></text>
<text x="0" y="111.5" text-anchor="middle" xml:space="preserve"><tspan>this all happens in as a</tspan></text>
<text x="0" y="137.5" text-anchor="middle" xml:space="preserve"><tspan>constructive, intersectional and</tspan></text>
<text x="0" y="163.5" text-anchor="middle" xml:space="preserve"><tspan>(de-polarizing) way as possible?</tspan></text>
</g>
<g class="label" data-node="1" fill="#82348c" font-size="15.3" filter="url(#cg-halo)">
<text x="696" y="-389" text-anchor="end" xml:space="preserve"><tspan>What are the core high level</tspan></text>
<text x="696" y="-371" text-anchor="end" xml:space="preserve"><tspan>problems/aspirations/hopes</tspan></text>
<text x="696" y="-353" text-anchor="end" xml:space="preserve"><tspan>that crypto/web3 movement</tspan></text>
<text x="696" y="-335" text-anchor="end" xml:space="preserve"><tspan>talks to ...</tspan></text>
</g>
<g class="label" data-node="1.1" fill="#82328c" font-size="15.3">
<text x="763.72" y="-351.5" text-anchor="start" xml:space="preserve"><tspan>What is an inventory of these aspirations</tspan></text>
<text x="763.72" y="-333.5" text-anchor="start" xml:space="preserve"><tspan>and what are the most important?</tspan></text>
</g>
<g class="label" data-node="1.2" fill="#7e3388" font-size="15.3">
<text x="763.72" y="-300.5" text-anchor="start" xml:space="preserve"><tspan>What are the political imaginaries/ideologies</tspan></text>
<text x="763.72" y="-282.5" text-anchor="start" xml:space="preserve"><tspan>that relate to this?</tspan></text>
</g>
<g class="label" data-node="2" fill="#2e4e81" font-size="15.3" filter="url(#cg-halo)">
<text x="696" y="-214.5" text-anchor="end" xml:space="preserve"><tspan>What is our evaluation i.e.</tspan></text>
<text x="696" y="-196.5" text-anchor="end" xml:space="preserve"><tspan>how would crypto/web3</tspan></text>
<text x="696" y="-178.5" text-anchor="end" xml:space="preserve"><tspan>address those aspirations,</tspan></text>
<text x="696" y="-160.5" text-anchor="end" xml:space="preserve"><tspan>how else could they be</tspan></text>
<text x="696" y="-142.5" text-anchor="end" xml:space="preserve"><tspan>addressed (outside web3</tspan></text>
<text x="696" y="-124.5" text-anchor="end" xml:space="preserve"><tspan>etc), and what are the risks</tspan></text>
<text x="696" y="-106.5" text-anchor="end" xml:space="preserve"><tspan>of web3 / crypto?</tspan></text>
</g>
<g class="label" data-node="2.1" fill="#2d4c7e" font-size="15.3">
<text x="764.08" y="-174" text-anchor="start" xml:space="preserve"><tspan>What is the matrix of +ve claims for</tspan></text>
<text x="764.08" y="-156" text-anchor="start" xml:space="preserve"><tspan>web3/crypto vs aspirations?</tspan></text>
</g>
<g class="label" data-node="2.2" fill="#2c4d82" font-size="15.3">
<text x="764.08" y="-123" text-anchor="start" xml:space="preserve"><tspan>What is the evaluation of these claims?</tspan></text>
</g>
<g class="label" data-node="2.3" fill="#2d4c7e" font-size="15.3">
<text x="764.08" y="-90" text-anchor="start" xml:space="preserve"><tspan>What are the other (non web3) ways of</tspan></text>
<text x="764.08" y="-72" text-anchor="start" xml:space="preserve"><tspan>addressing those aspirations ...?</tspan></text>
</g>
<g class="label" data-node="2.4" fill="#2f4e7f" font-size="15.3">
<text x="764.08" y="-39" text-anchor="start" xml:space="preserve"><tspan>What are the risks of the web3 movement</tspan></text>
<text x="764.08" y="-21" text-anchor="start" xml:space="preserve"><tspan>(beyond not fulfilling on its aspirations and</tspan></text>
<text x="764.08" y="-3" text-anchor="start" xml:space="preserve"><tspan>the opportunity cost of that)?</tspan></text>
</g>
<g class="label" data-node="3" fill="#2f7065" font-size="15.3" filter="url(#cg-halo)">
<text x="696" y="141.5" text-anchor="end" xml:space="preserve"><tspan>What key background ideas</tspan></text>
<text x="696" y="159.5" text-anchor="end" xml:space="preserve"><tspan>are needed / relevant?</tspan></text>
</g>
<g class="label" data-node="3.1" fill="#2f7468" font-size="13">
<text x="763.3" y="62.5" text-anchor="start" xml:space="preserve"><tspan>What do we mean by key terms?</tspan></text>
</g>
<g class="label" data-node="3.2" fill="#306c62" font-size="13">
<text x="763.3" y="92.5" text-anchor="start" xml:space="preserve"><tspan>What political theory / science?</tspan></text>
</g>
<g class="label" data-node="3.3" fill="#307569" font-size="13">
<text x="763.3" y="122.5" text-anchor="start" xml:space="preserve"><tspan>What economics and game theory?</tspan></text>
</g>
<g class="label" data-node="3.4" fill="#2f766a" font-size="13">
<text x="763.3" y="152.5" text-anchor="start" xml:space="preserve"><tspan>What macroeconomics?</tspan></text>
</g>
<g class="label" data-node="3.5" fill="#2e6f64" font-size="13">
<text x="763.3" y="182.5" text-anchor="start" xml:space="preserve"><tspan>What computer science?</tspan></text>
</g>
<g class="label" data-node="4" fill="#4f6f31" font-size="15.3" filter="url(#cg-halo)">
<text x="696" y="343" text-anchor="end" xml:space="preserve"><tspan>How does this contribute to</tspan></text>
<text x="696" y="361" text-anchor="end" xml:space="preserve"><tspan>wider sensemaking?</tspan></text>
</g>
<g class="label" data-node="4.1" fill="#4e6f30" font-size="13.8134">
<text x="763.9" y="248.5" text-anchor="start" xml:space="preserve"><tspan>Why has crypto/web3 (narrative) been so</tspan></text>
<text x="763.9" y="264.5" text-anchor="start" xml:space="preserve"><tspan>attractive (successful?)?</tspan></text>
</g>
<g class="label" data-node="4.2" fill="#527333" font-size="13.8134">
<text x="763.9" y="295.5" text-anchor="start" xml:space="preserve"><tspan>How do we share what we are doing?</tspan></text>
</g>
<g class="label" data-node="4.3" fill="#4c6c2f" font-size="13">
<text x="763.9" y="325.5" text-anchor="start" xml:space="preserve"><tspan>How do we involve others in the</tspan></text>
<text x="763.9" y="340.5" text-anchor="start" xml:space="preserve"><tspan>sensemaking process?</tspan></text>
</g>
<g class="label" data-node="4.4" fill="#517331" font-size="13">
<text x="763.9" y="370.5" text-anchor="start" xml:space="preserve"><tspan>What framework can we use to answer the</tspan></text>
<text x="763.9" y="385.5" text-anchor="start" xml:space="preserve"><tspan>question of whether crypto or web3 is useful and in</tspan></text>
<text x="763.9" y="400.5" text-anchor="start" xml:space="preserve"><tspan>what way …?</tspan></text>
</g>
</g></svg>
