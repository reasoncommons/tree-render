<g class="label" data-node="root" fill="#414141" font-size="17">
<text x="0" y="-114.5" text-anchor="middle" xml:space="preserve"><tspan>[Web3] What is the evaluation of</tspan></text>
<text x="0" y="-94.5" text-anchor="middle" xml:space="preserve"><tspan>the various claims (+ve or -ve) for</tspan></text>
<text x="0" y="-74.5" text-anchor="middle" xml:space="preserve"><tspan>web3/crypto (and the supporting</tspan></text>
<text x="0" y="-54.5" text-anchor="middle" xml:space="preserve"><tspan>reasoning/sensemaking) so that</tspan></text>
<text x="0" y="-34.5" text-anchor="middle" xml:space="preserve"><tspan>… we (collectively as individuals,</tspan></text>
<text x="0" y="-14.5" text-anchor="middle" xml:space="preserve"><tspan>societies etc) make good choices</tspan></text>
<text x="0" y="5.5" text-anchor="middle" xml:space="preserve"><tspan>te the technology (whether to</tspan></text>
<text x="0" y="25.5" text-anchor="middle" xml:space="preserve"><tspan>support, improve or curb) and</tspan></text>
<text x="0" y="45.5" text-anchor="middle" xml:space="preserve"><tspan>allocate our resources (attention,</tspan></text>
<text x="0" y="65.5" text-anchor="middle" xml:space="preserve"><tspan>energy, money) effectively and</tspan></text>
<text x="0" y="85.5" text-anchor="middle" xml:space="preserve"><tspan>this all happens in as a</tspan></text>
<text x="0" y="105.5" text-anchor="middle" xml:space="preserve"><tspan>constructive, intersectional and</tspan></text>
<text x="0" y="125.5" text-anchor="middle" xml:space="preserve"><tspan>(de-polarizing) way as possible?</tspan></text>
</g>
<g class="label" data-node="1" fill="#82348c" font-size="15.3" filter="url(#cg-halo)">
<text x="702.2" y="-554.75" text-anchor="end" xml:space="preserve"><tspan>What are the core high level</tspan></text>
<text x="702.2" y="-536.75" text-anchor="end" xml:space="preserve"><tspan>problems/aspirations/hopes that</tspan></text>
<text x="702.2" y="-518.75" text-anchor="end" xml:space="preserve"><tspan>crypto/web3 movement talks to ...</tspan></text>
</g>
<g class="label" data-node="1.1" fill="#82328c" font-size="15.3">
<text x="769.92" y="-535.25" text-anchor="start" xml:space="preserve"><tspan>What is an inventory of these aspirations</tspan></text>
<text x="769.92" y="-517.25" text-anchor="start" xml:space="preserve"><tspan>and what are the most important?</tspan></text>
</g>
<g class="label" data-node="1.2" fill="#7e3388" font-size="15.3">
<text x="769.92" y="-484.25" text-anchor="start" xml:space="preserve"><tspan>What are the political imaginaries/ideologies</tspan></text>
<text x="769.92" y="-466.25" text-anchor="start" xml:space="preserve"><tspan>that relate to this?</tspan></text>
</g>
<g class="label" data-node="2" fill="#2e4e81" font-size="15.3" filter="url(#cg-halo)">
<text x="702.2" y="-272.75" text-anchor="end" xml:space="preserve"><tspan>What is our evaluation i.e. how would</tspan></text>
<text x="702.2" y="-254.75" text-anchor="end" xml:space="preserve"><tspan>crypto/web3 address those</tspan></text>
<text x="702.2" y="-236.75" text-anchor="end" xml:space="preserve"><tspan>aspirations, how else could they be</tspan></text>
<text x="702.2" y="-218.75" text-anchor="end" xml:space="preserve"><tspan>addressed (outside web3 etc), and</tspan></text>
<text x="702.2" y="-200.75" text-anchor="end" xml:space="preserve"><tspan>what are the risks of web3 / crypto?</tspan></text>
</g>
<g class="label" data-node="2.1" fill="#2d4c7e" font-size="15.3">
<text x="770.28" y="-268.25" text-anchor="start" xml:space="preserve"><tspan>What is the matrix of +ve claims for</tspan></text>
<text x="770.28" y="-250.25" text-anchor="start" xml:space="preserve"><tspan>web3/crypto vs aspirations?</tspan></text>
</g>
<g class="label" data-node="2.2" fill="#2c4d82" font-size="15.3">
<text x="770.28" y="-217.25" text-anchor="start" xml:space="preserve"><tspan>What is the evaluation of these claims?</tspan></text>
</g>
<g class="label" data-node="2.3" fill="#2d4c7e" font-size="15.3">
<text x="770.28" y="-184.25" text-anchor="start" xml:space="preserve"><tspan>What are the other (non web3) ways of</tspan></text>
<text x="770.28" y="-166.25" text-anchor="start" xml:space="preserve"><tspan>addressing those aspirations ...?</tspan></text>
</g>
<g class="label" data-node="2.4" fill="#2f4e7f" font-size="15.3">
<text x="770.28" y="-133.25" text-anchor="start" xml:space="preserve"><tspan>What are the risks of the web3 movement</tspan></text>
<text x="770.28" y="-115.25" text-anchor="start" xml:space="preserve"><tspan>(beyond not fulfilling on its aspirations and</tspan></text>
<text x="770.28" y="-97.25" text-anchor="start" xml:space="preserve"><tspan>the opportunity cost of that)?</tspan></text>
</g>
<g class="label" data-node="3" fill="#2f7065" font-size="15.3" filter="url(#cg-halo)">
<text x="702.2" y="177.25" text-anchor="end" xml:space="preserve"><tspan>What key background ideas are</tspan></text>
<text x="702.2" y="195.25" text-anchor="end" xml:space="preserve"><tspan>needed / relevant?</tspan></text>
</g>
<g class="label" data-node="3.1" fill="#2f7468" font-size="13">
<text x="769.5" y="98.25" text-anchor="start" xml:space="preserve"><tspan>What do we mean by key terms?</tspan></text>
</g>
<g class="label" data-node="3.2" fill="#306c62" font-size="13">
<text x="769.5" y="128.25" text-anchor="start" xml:space="preserve"><tspan>What political theory / science?</tspan></text>
</g>
<g class="label" data-node="3.3" fill="#307569" font-size="13">
<text x="769.5" y="158.25" text-anchor="start" xml:space="preserve"><tspan>What economics and game theory?</tspan></text>
</g>
<g class="label" data-node="3.4" fill="#2f766a" font-size="13">
<text x="769.5" y="188.25" text-anchor="start" xml:space="preserve"><tspan>What macroeconomics?</tspan></text>
</g>
<g class="label" data-node="3.5" fill="#2e6f64" font-size="13">
<text x="769.5" y="218.25" text-anchor="start" xml:space="preserve"><tspan>What computer science?</tspan></text>
</g>
<g class="label" data-node="4" fill="#4f6f31" font-size="15.3" filter="url(#cg-halo)">
<text x="702.2" y="508.75" text-anchor="end" xml:space="preserve"><tspan>How does this contribute to wider</tspan></text>
<text x="702.2" y="526.75" text-anchor="end" xml:space="preserve"><tspan>sensemaking?</tspan></text>
</g>
<g class="label" data-node="4.1" fill="#4e6f30" font-size="13.8134">
<text x="770.1" y="414.25" text-anchor="start" xml:space="preserve"><tspan>Why has crypto/web3 (narrative) been so</tspan></text>
<text x="770.1" y="430.25" text-anchor="start" xml:space="preserve"><tspan>attractive (successful?)?</tspan></text>
</g>
<g class="label" data-node="4.2" fill="#527333" font-size="13.8134">
<text x="770.1" y="461.25" text-anchor="start" xml:space="preserve"><tspan>How do we share what we are doing?</tspan></text>
</g>
<g class="label" data-node="4.3" fill="#4c6c2f" font-size="13">
<text x="770.1" y="491.25" text-anchor="start" xml:space="preserve"><tspan>How do we involve others in the sensemaking</tspan></text>
<text x="770.1" y="506.25" text-anchor="start" xml:space="preserve"><tspan>process?</tspan></text>
</g>
<g class="label" data-node="4.4" fill="#517331" font-size="13">
<text x="770.1" y="536.25" text-anchor="start" xml:space="preserve"><tspan>What framework can we use to answer the question</tspan></text>
<text x="770.1" y="551.25" text-anchor="start" xml:space="preserve"><tspan>of whether crypto or web3 is useful and in what way</tspan></text>
<text x="770.1" y="566.25" text-anchor="start" xml:space="preserve"><tspan>…?</tspan></text>
</g>
</g></svg>
