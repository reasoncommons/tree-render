<g class="label" data-node="root" fill="#414141" font-size="17">
<text x="0" y="-114.5" text-anchor="middle" xml:space="preserve"><tspan>[Web3] What is the evaluation of</tspan></text>
<text x="0" y="-94.5" text-anchor="middle" xml:space="preserve"><tspan>the various claims (+ve or -ve) for</tspan></text>
<text x="0" y="-74.5" text-anchor="middle" xml:space="preserve"><tspan>web3/crypto (and the supporting</tspan></text>
<text x="0" y="-54.5" text-anchor="middle" xml:space="preserve"><tspan>reasoning/sensemaking) so that</tspan></text>
<text x="0" y="-34.5" text-anchor="middle" xml:space="preserve"><tspan>… we (collectively as individuals,</tspan></text>
<text x="0" y="-14.5" text-anchor="middle" xml:space="preserve"><tspan>societies etc) make good choices</tspan></text>
<text x="0" y="5.5" text-anchor="middle" xml:space="preserve"><tspan>te the technology (whether to</tspan></text>
<text x="0" y="25.5" text-anchor="middle" xml:space="preserve"><tspan>support, improve or curb) and</tspan></text>
<text x="0" y="45.5" text-anchor="middle" xml:space="preserve"><tspan>allocate our resources (attention,</tspan></text>
<text x="0" y="65.5" text-anchor="middle" xml:space="preserve"><tspan>energy, money) effectively and</tspan></text>
<text x="0" y="85.5" text-anchor="middle" xml:space="preserve"><tspan>this all happens in as a</tspan></text>
<text x="0" y="105.5" text-anchor="middle" xml:space="preserve"><tspan>constructive, intersectional and</tspan></text>
<text x="0" y="125.5" text-anchor="middle" xml:space="preserve"><tspan>(de-polarizing) way as possible?</tspan></text>
</g>
<g class="label" data-node="1" fill="#82348c" font-size="15.3" filter="url(#cg-halo)">
<text x="662" y="-402.75" text-anchor="end" xml:space="preserve"><tspan>What are the core high level</tspan></text>
<text x="662" y="-384.75" text-anchor="end" xml:space="preserve"><tspan>problems/aspirations/hopes</tspan></text>
<text x="662" y="-366.75" text-anchor="end" xml:space="preserve"><tspan>that crypto/web3 movement</tspan></text>
<text x="662" y="-348.75" text-anchor="end" xml:space="preserve"><tspan>talks to ...</tspan></text>
</g>
<g class="label" data-node="1.1" fill="#82328c" font-size="15.3">
<text x="729.72" y="-365.25" text-anchor="start" xml:space="preserve"><tspan>What is an inventory of these aspirations</tspan></text>
<text x="729.72" y="-347.25" text-anchor="start" xml:space="preserve"><tspan>and what are the most important?</tspan></text>
</g>
<g class="label" data-node="1.2" fill="#7e3388" font-size="15.3">
<text x="729.72" y="-314.25" text-anchor="start" xml:space="preserve"><tspan>What are the political imaginaries/ideologies</tspan></text>
<text x="729.72" y="-296.25" text-anchor="start" xml:space="preserve"><tspan>that relate to this?</tspan></text>
</g>
<g class="label" data-node="2" fill="#2e4e81" font-size="15.3" filter="url(#cg-halo)">
<text x="662" y="-230.75" text-anchor="end" xml:space="preserve"><tspan>What is our evaluation i.e.</tspan></text>
<text x="662" y="-212.75" text-anchor="end" xml:space="preserve"><tspan>how would crypto/web3</tspan></text>
<text x="662" y="-194.75" text-anchor="end" xml:space="preserve"><tspan>address those aspirations,</tspan></text>
<text x="662" y="-176.75" text-anchor="end" xml:space="preserve"><tspan>how else could they be</tspan></text>
<text x="662" y="-158.75" text-anchor="end" xml:space="preserve"><tspan>addressed (outside web3</tspan></text>
<text x="662" y="-140.75" text-anchor="end" xml:space="preserve"><tspan>etc), and what are the risks</tspan></text>
<text x="662" y="-122.75" text-anchor="end" xml:space="preserve"><tspan>of web3 / crypto?</tspan></text>
</g>
<g class="label" data-node="2.1" fill="#2d4c7e" font-size="15.3">
<text x="730.08" y="-190.25" text-anchor="start" xml:space="preserve"><tspan>What is the matrix of +ve claims for</tspan></text>
<text x="730.08" y="-172.25" text-anchor="start" xml:space="preserve"><tspan>web3/crypto vs aspirations?</tspan></text>
</g>
<g class="label" data-node="2.2" fill="#2c4d82" font-size="15.3">
<text x="730.08" y="-139.25" text-anchor="start" xml:space="preserve"><tspan>What is the evaluation of these claims?</tspan></text>
</g>
<g class="label" data-node="2.3" fill="#2d4c7e" font-size="15.3">
<text x="730.08" y="-106.25" text-anchor="start" xml:space="preserve"><tspan>What are the other (non web3) ways of</tspan></text>
<text x="730.08" y="-88.25" text-anchor="start" xml:space="preserve"><tspan>addressing those aspirations ...?</tspan></text>
</g>
<g class="label" data-node="2.4" fill="#2f4e7f" font-size="15.3">
<text x="730.08" y="-55.25" text-anchor="start" xml:space="preserve"><tspan>What are the risks of the web3 movement</tspan></text>
<text x="730.08" y="-37.25" text-anchor="start" xml:space="preserve"><tspan>(beyond not fulfilling on its aspirations and</tspan></text>
<text x="730.08" y="-19.25" text-anchor="start" xml:space="preserve"><tspan>the opportunity cost of that)?</tspan></text>
</g>
<g class="label" data-node="3" fill="#2f7065" font-size="15.3" filter="url(#cg-halo)">
<text x="662" y="140.25" text-anchor="end" xml:space="preserve"><tspan>What key background ideas</tspan></text>
<text x="662" y="158.25" text-anchor="end" xml:space="preserve"><tspan>are needed / relevant?</tspan></text>
</g>
<g class="label" data-node="3.1" fill="#2f7468" font-size="13">
<text x="729.3" y="61.25" text-anchor="start" xml:space="preserve"><tspan>What do we mean by key terms?</tspan></text>
</g>
<g class="label" data-node="3.2" fill="#306c62" font-size="13">
<text x="729.3" y="91.25" text-anchor="start" xml:space="preserve"><tspan>What political theory / science?</tspan></text>
</g>
<g class="label" data-node="3.3" fill="#307569" font-size="13">
<text x="729.3" y="121.25" text-anchor="start" xml:space="preserve"><tspan>What economics and game theory?</tspan></text>
</g>
<g class="label" data-node="3.4" fill="#2f766a" font-size="13">
<text x="729.3" y="151.25" text-anchor="start" xml:space="preserve"><tspan>What macroeconomics?</tspan></text>
</g>
<g class="label" data-node="3.5" fill="#2e6f64" font-size="13">
<text x="729.3" y="181.25" text-anchor="start" xml:space="preserve"><tspan>What computer science?</tspan></text>
</g>
<g class="label" data-node="4" fill="#4f6f31" font-size="15.3" filter="url(#cg-halo)">
<text x="662" y="356.75" text-anchor="end" xml:space="preserve"><tspan>How does this contribute to</tspan></text>
<text x="662" y="374.75" text-anchor="end" xml:space="preserve"><tspan>wider sensemaking?</tspan></text>
</g>
<g class="label" data-node="4.1" fill="#4e6f30" font-size="13.8134">
<text x="729.9" y="262.25" text-anchor="start" xml:space="preserve"><tspan>Why has crypto/web3 (narrative) been so</tspan></text>
<text x="729.9" y="278.25" text-anchor="start" xml:space="preserve"><tspan>attractive (successful?)?</tspan></text>
</g>
<g class="label" data-node="4.2" fill="#527333" font-size="13.8134">
<text x="729.9" y="309.25" text-anchor="start" xml:space="preserve"><tspan>How do we share what we are doing?</tspan></text>
</g>
<g class="label" data-node="4.3" fill="#4c6c2f" font-size="13">
<text x="729.9" y="339.25" text-anchor="start" xml:space="preserve"><tspan>How do we involve others in the sensemaking</tspan></text>
<text x="729.9" y="354.25" text-anchor="start" xml:space="preserve"><tspan>process?</tspan></text>
</g>
<g class="label" data-node="4.4" fill="#517331" font-size="13">
<text x="729.9" y="384.25" text-anchor="start" xml:space="preserve"><tspan>What framework can we use to answer the question</tspan></text>
<text x="729.9" y="399.25" text-anchor="start" xml:space="preserve"><tspan>of whether crypto or web3 is useful and in what way</tspan></text>
<text x="729.9" y="414.25" text-anchor="start" xml:space="preserve"><tspan>…?</tspan></text>
</g>
</g></svg>
