<g class="label" data-node="root" fill="#414141" font-size="22">
<text x="0" y="-175" text-anchor="middle" xml:space="preserve"><tspan>[Web3] What is the evaluation</tspan></text>
<text x="0" y="-149" text-anchor="middle" xml:space="preserve"><tspan>of the various claims (+ve or</tspan></text>
<text x="0" y="-123" text-anchor="middle" xml:space="preserve"><tspan>-ve) for web3/crypto (and the</tspan></text>
<text x="0" y="-97" text-anchor="middle" xml:space="preserve"><tspan>supporting</tspan></text>
<text x="0" y="-71" text-anchor="middle" xml:space="preserve"><tspan>reasoning/sensemaking) so</tspan></text>
<text x="0" y="-45" text-anchor="middle" xml:space="preserve"><tspan>that … we (collectively as</tspan></text>
<text x="0" y="-19" text-anchor="middle" xml:space="preserve"><tspan>individuals, societies etc) make</tspan></text>
<text x="0" y="7" text-anchor="middle" xml:space="preserve"><tspan>good choices te the technology</tspan></text>
<text x="0" y="33" text-anchor="middle" xml:space="preserve"><tspan>(whether to support, improve</tspan></text>
<text x="0" y="59" text-anchor="middle" xml:space="preserve"><tspan>or curb) and allocate our</tspan></text>
<text x="0" y="85" text-anchor="middle" xml:space="preserve"><tspan>resources (attention, energy,</tspan></text>
<text x="0" y="111" text-anchor="middle" xml:space="preserve"><tspan>money) effectively and this all</tspan></text>
<text x="0" y="137" text-anchor="middle" xml:space="preserve"><tspan>happens in as a constructive,</tspan></text>
<text x="0" y="163" text-anchor="middle" xml:space="preserve"><tspan>intersectional and</tspan></text>
<text x="0" y="189" text-anchor="middle" xml:space="preserve"><tspan>(de-polarizing) way as possible?</tspan></text>
</g>
<g class="label" data-node="1" fill="#82348c" font-size="15.3" filter="url(#cg-halo)">
<text x="549.4" y="-421.5" text-anchor="end" xml:space="preserve"><tspan>What are the core high level</tspan></text>
<text x="549.4" y="-403.5" text-anchor="end" xml:space="preserve"><tspan>problems/aspirations/hopes</tspan></text>
<text x="549.4" y="-385.5" text-anchor="end" xml:space="preserve"><tspan>that crypto/web3 movement</tspan></text>
<text x="549.4" y="-367.5" text-anchor="end" xml:space="preserve"><tspan>talks to ...</tspan></text>
</g>
<g class="label" data-node="1.1" fill="#82328c" font-size="15.3">
<text x="617.12" y="-384" text-anchor="start" xml:space="preserve"><tspan>What is an inventory of these aspirations</tspan></text>
<text x="617.12" y="-366" text-anchor="start" xml:space="preserve"><tspan>and what are the most important?</tspan></text>
</g>
<g class="label" data-node="1.2" fill="#7e3388" font-size="15.3">
<text x="617.12" y="-333" text-anchor="start" xml:space="preserve"><tspan>What are the political</tspan></text>
<text x="617.12" y="-315" text-anchor="start" xml:space="preserve"><tspan>imaginaries/ideologies that relate to this?</tspan></text>
</g>
<g class="label" data-node="2" fill="#2e4e81" font-size="15.3" filter="url(#cg-halo)">
<text x="549.4" y="-227" text-anchor="end" xml:space="preserve"><tspan>What is our evaluation i.e. how</tspan></text>
<text x="549.4" y="-209" text-anchor="end" xml:space="preserve"><tspan>would crypto/web3 address</tspan></text>
<text x="549.4" y="-191" text-anchor="end" xml:space="preserve"><tspan>those aspirations, how else</tspan></text>
<text x="549.4" y="-173" text-anchor="end" xml:space="preserve"><tspan>could they be addressed</tspan></text>
<text x="549.4" y="-155" text-anchor="end" xml:space="preserve"><tspan>(outside web3 etc), and what</tspan></text>
<text x="549.4" y="-137" text-anchor="end" xml:space="preserve"><tspan>are the risks of web3 / crypto?</tspan></text>
</g>
<g class="label" data-node="2.1" fill="#2d4c7e" font-size="15.3">
<text x="617.84" y="-213.5" text-anchor="start" xml:space="preserve"><tspan>What is the matrix of +ve claims for</tspan></text>
<text x="617.84" y="-195.5" text-anchor="start" xml:space="preserve"><tspan>web3/crypto vs aspirations?</tspan></text>
</g>
<g class="label" data-node="2.2" fill="#2c4d82" font-size="15.3">
<text x="617.84" y="-162.5" text-anchor="start" xml:space="preserve"><tspan>What is the evaluation of these claims?</tspan></text>
</g>
<g class="label" data-node="2.3" fill="#2d4c7e" font-size="15.3">
<text x="617.84" y="-129.5" text-anchor="start" xml:space="preserve"><tspan>What are the other (non web3) ways of</tspan></text>
<text x="617.84" y="-111.5" text-anchor="start" xml:space="preserve"><tspan>addressing those aspirations ...?</tspan></text>
</g>
<g class="label" data-node="2.4" fill="#2f4e7f" font-size="15.3">
<text x="617.84" y="-78.5" text-anchor="start" xml:space="preserve"><tspan>What are the risks of the web3</tspan></text>
<text x="617.84" y="-60.5" text-anchor="start" xml:space="preserve"><tspan>movement (beyond not fulfilling on its</tspan></text>
<text x="617.84" y="-42.5" text-anchor="start" xml:space="preserve"><tspan>aspirations and the opportunity cost</tspan></text>
<text x="617.84" y="-24.5" text-anchor="start" xml:space="preserve"><tspan>of that)?</tspan></text>
</g>
<g class="label" data-node="3" fill="#2f7065" font-size="15.3" filter="url(#cg-halo)">
<text x="549.4" y="142.5" text-anchor="end" xml:space="preserve"><tspan>What key background ideas</tspan></text>
<text x="549.4" y="160.5" text-anchor="end" xml:space="preserve"><tspan>are needed / relevant?</tspan></text>
</g>
<g class="label" data-node="3.1" fill="#2f7468" font-size="13">
<text x="616.72" y="61.5" text-anchor="start" xml:space="preserve"><tspan>What do we mean by key terms?</tspan></text>
</g>
<g class="label" data-node="3.2" fill="#306c62" font-size="13">
<text x="616.72" y="92.5" text-anchor="start" xml:space="preserve"><tspan>What political theory / science?</tspan></text>
</g>
<g class="label" data-node="3.3" fill="#307569" font-size="13">
<text x="616.72" y="123.5" text-anchor="start" xml:space="preserve"><tspan>What economics and game theory?</tspan></text>
</g>
<g class="label" data-node="3.4" fill="#2f766a" font-size="13">
<text x="616.72" y="154.5" text-anchor="start" xml:space="preserve"><tspan>What macroeconomics?</tspan></text>
</g>
<g class="label" data-node="3.5" fill="#2e6f64" font-size="13">
<text x="616.72" y="185.5" text-anchor="start" xml:space="preserve"><tspan>What computer science?</tspan></text>
</g>
<g class="label" data-node="4" fill="#4f6f31" font-size="15.3" filter="url(#cg-halo)">
<text x="549.4" y="370.5" text-anchor="end" xml:space="preserve"><tspan>How does this contribute to</tspan></text>
<text x="549.4" y="388.5" text-anchor="end" xml:space="preserve"><tspan>wider sensemaking?</tspan></text>
</g>
<g class="label" data-node="4.1" fill="#4e6f30" font-size="13.8134">
<text x="617.36" y="272.5" text-anchor="start" xml:space="preserve"><tspan>Why has crypto/web3 (narrative) been so</tspan></text>
<text x="617.36" y="289.5" text-anchor="start" xml:space="preserve"><tspan>attractive (successful?)?</tspan></text>
</g>
<g class="label" data-node="4.2" fill="#527333" font-size="13.8134">
<text x="617.36" y="321.5" text-anchor="start" xml:space="preserve"><tspan>How do we share what we are doing?</tspan></text>
</g>
<g class="label" data-node="4.3" fill="#4c6c2f" font-size="13">
<text x="617.36" y="352.5" text-anchor="start" xml:space="preserve"><tspan>How do we involve others in the</tspan></text>
<text x="617.36" y="368.5" text-anchor="start" xml:space="preserve"><tspan>sensemaking process?</tspan></text>
</g>
<g class="label" data-node="4.4" fill="#517331" font-size="13">
<text x="617.36" y="399.5" text-anchor="start" xml:space="preserve"><tspan>What framework can we use to answer the</tspan></text>
<text x="617.36" y="415.5" text-anchor="start" xml:space="preserve"><tspan>question of whether crypto or web3 is useful</tspan></text>
<text x="617.36" y="431.5" text-anchor="start" xml:space="preserve"><tspan>and in what way …?</tspan></text>
</g>
</g></svg>
