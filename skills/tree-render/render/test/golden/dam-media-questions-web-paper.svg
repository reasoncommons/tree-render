<g class="node" data-num="root" data-depth="0" transform="translate(0,229.8)"><text y="15.4" font-size="18" font-family="ApfelMittel" fill="#1F1C18">How should Life Itself make</text><text y="36.1" font-size="18" font-family="ApfelMittel" fill="#1F1C18">its strong existing images</text><text y="56.8" font-size="18" font-family="ApfelMittel" fill="#1F1C18">and video quick to find</text><text y="77.5" font-size="18" font-family="ApfelMittel" fill="#1F1C18">and reuse for the people</text><text y="98.2" font-size="18" font-family="ApfelMittel" fill="#1F1C18">building pages and doing</text><text y="118.9" font-size="18" font-family="ApfelMittel" fill="#1F1C18">comms, without relying on</text><text y="139.6" font-size="18" font-family="ApfelMittel" fill="#1F1C18">tagging at capture?</text></g>
<g class="node" data-num="1" data-depth="1" transform="translate(341.3,0)"><text y="17.7" font-size="19" font-family="ApfelMittel" fill="#1F1C18">Is finding media actually a real</text><text y="42.4" font-size="19" font-family="ApfelMittel" fill="#1F1C18">constraint on site and comms</text><text y="67.1" font-size="19" font-family="ApfelMittel" fill="#1F1C18">work, and where does it bite?</text></g>
<g class="node" data-num="2" data-depth="1" transform="translate(341.3,94)"><text y="17.7" font-size="19" font-family="ApfelMittel" fill="#1F1C18">Who does the hunting</text><text y="42.4" font-size="19" font-family="ApfelMittel" fill="#1F1C18">today, and what do</text><text y="67.1" font-size="19" font-family="ApfelMittel" fill="#1F1C18">they need in practice?</text></g>
<g class="node" data-num="2.1" data-depth="2" transform="translate(645.1,108.9)"><text y="15.8" font-size="17" fill="#1F1C18">Which live pages and comms pieces</text><text y="37.9" font-size="17" fill="#1F1C18">need what media first (Hubs site first)?</text></g>
<g class="node" data-num="3" data-depth="1" transform="translate(341.3,188)"><text y="17.7" font-size="19" font-family="ApfelMittel" fill="#1F1C18">Where does our material</text><text y="42.4" font-size="19" font-family="ApfelMittel" fill="#1F1C18">live today? (Drive partly</text><text y="67.1" font-size="19" font-family="ApfelMittel" fill="#1F1C18">surveyed in Sept)</text></g>
<g class="node" data-num="3.1" data-depth="2" transform="translate(645.1,191.9)"><text y="15.8" font-size="17" fill="#1F1C18">Who knows or controls each</text><text y="37.9" font-size="17" fill="#1F1C18">location, and who can actually</text><text y="60" font-size="17" fill="#1F1C18">get material out for us?</text></g>
<g class="node" data-num="4" data-depth="1" transform="translate(341.3,293)"><text y="17.7" font-size="19" font-family="ApfelMittel" fill="#1F1C18">Should findable</text><text y="42.4" font-size="19" font-family="ApfelMittel" fill="#1F1C18">material be moved into</text><text y="67.1" font-size="19" font-family="ApfelMittel" fill="#1F1C18">one archive, or pointed</text><text y="91.8" font-size="19" font-family="ApfelMittel" fill="#1F1C18">to where it already lives?</text></g>
<g class="node" data-num="5" data-depth="1" transform="translate(341.3,411.7)"><text y="17.7" font-size="19" font-family="ApfelMittel" fill="#1F1C18">What must we know about</text><text y="42.4" font-size="19" font-family="ApfelMittel" fill="#1F1C18">each asset, and how do we</text><text y="67.1" font-size="19" font-family="ApfelMittel" fill="#1F1C18">tell what's "strong" without</text><text y="91.8" font-size="19" font-family="ApfelMittel" fill="#1F1C18">tagging at capture?</text></g>
<g class="node" data-num="5.1" data-depth="2" transform="translate(645.1,411.9)"><text y="15.8" font-size="17" fill="#1F1C18">What is the minimum to record</text><text y="37.9" font-size="17" fill="#1F1C18">(source, date, used where)?</text></g>
<g class="node" data-num="5.2" data-depth="2" transform="translate(645.1,466.1)"><text y="15.8" font-size="17" fill="#1F1C18">Can use, a quick human</text><text y="37.9" font-size="17" fill="#1F1C18">pick, or AI signal "strong"?</text></g>
<g class="node" data-num="6" data-depth="1" transform="translate(341.3,530.4)"><text y="17.7" font-size="19" font-family="ApfelMittel" fill="#1F1C18">How will we know the</text><text y="42.4" font-size="19" font-family="ApfelMittel" fill="#1F1C18">first attempt worked well</text><text y="67.1" font-size="19" font-family="ApfelMittel" fill="#1F1C18">enough to continue?</text></g>
<g class="node" data-num="6.1" data-depth="2" transform="translate(645.1,534.3)"><text y="15.8" font-size="17" fill="#1F1C18">Does it fit the wider comms</text><text y="37.9" font-size="17" fill="#1F1C18">pipeline (Riverside, Canva,</text><text y="60" font-size="17" fill="#1F1C18">episode records), or fight it?</text></g>
</g>
