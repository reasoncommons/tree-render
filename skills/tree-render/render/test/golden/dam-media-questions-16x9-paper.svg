<g class="node" data-num="root" data-depth="0" transform="translate(0,330.9)"><text y="27.7" font-size="33" font-family="ApfelMittel" fill="#1F1C18">How should Life Itself make</text><text y="64.7" font-size="33" font-family="ApfelMittel" fill="#1F1C18">its strong existing images</text><text y="101.6" font-size="33" font-family="ApfelMittel" fill="#1F1C18">and video quick to find</text><text y="138.6" font-size="33" font-family="ApfelMittel" fill="#1F1C18">and reuse for the people</text><text y="175.6" font-size="33" font-family="ApfelMittel" fill="#1F1C18">building pages and doing</text><text y="212.5" font-size="33" font-family="ApfelMittel" fill="#1F1C18">comms, without relying on</text><text y="249.5" font-size="33" font-family="ApfelMittel" fill="#1F1C18">tagging at capture?</text></g>
<g class="node" data-num="1" data-depth="1" transform="translate(601.4,0)"><text y="32" font-size="36" font-family="ApfelMittel" fill="#1F1C18">Is finding media actually a real</text><text y="76" font-size="36" font-family="ApfelMittel" fill="#1F1C18">constraint on site and comms</text><text y="119.9" font-size="36" font-family="ApfelMittel" fill="#1F1C18">work, and where does it bite?</text></g>
<g class="node" data-num="2" data-depth="1" transform="translate(601.4,162.9)"><text y="32" font-size="36" font-family="ApfelMittel" fill="#1F1C18">Who does the hunting today, and</text><text y="76" font-size="36" font-family="ApfelMittel" fill="#1F1C18">what do they need in practice?</text></g>
<g class="node" data-num="2.1" data-depth="2" transform="translate(1203.5,173)"><text y="24.4" font-size="27" fill="#1F1C18">Which live pages and comms pieces</text><text y="58.2" font-size="27" fill="#1F1C18">need what media first (Hubs site first)?</text></g>
<g class="node" data-num="3" data-depth="1" transform="translate(601.4,281.8)"><text y="32" font-size="36" font-family="ApfelMittel" fill="#1F1C18">Where does our material</text><text y="76" font-size="36" font-family="ApfelMittel" fill="#1F1C18">live today? (Drive partly</text><text y="119.9" font-size="36" font-family="ApfelMittel" fill="#1F1C18">surveyed in Sept)</text></g>
