<g class="node" data-num="4" data-depth="1" transform="translate(601.4,463)"><text y="32" font-size="36" font-family="ApfelMittel" fill="#1F1C18">Should findable material be</text><text y="76" font-size="36" font-family="ApfelMittel" fill="#1F1C18">moved into one archive, or</text><text y="119.9" font-size="36" font-family="ApfelMittel" fill="#1F1C18">pointed to where it already lives?</text></g>
<g class="node" data-num="5" data-depth="1" transform="translate(601.4,625.9)"><text y="32" font-size="36" font-family="ApfelMittel" fill="#1F1C18">What must we know about</text><text y="76" font-size="36" font-family="ApfelMittel" fill="#1F1C18">each asset, and how do we</text><text y="119.9" font-size="36" font-family="ApfelMittel" fill="#1F1C18">tell what's "strong" without</text><text y="163.8" font-size="36" font-family="ApfelMittel" fill="#1F1C18">tagging at capture?</text></g>
