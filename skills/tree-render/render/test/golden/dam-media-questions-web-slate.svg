<g class="node" data-num="root" data-depth="0" transform="translate(0,229.8)"><text y="15.4" font-size="18" font-family="ApfelMittel" fill="#ECEAE4">How should Life Itself make</text><text y="36.1" font-size="18" font-family="ApfelMittel" fill="#ECEAE4">its strong existing images</text><text y="56.8" font-size="18" font-family="ApfelMittel" fill="#ECEAE4">and video quick to find</text><text y="77.5" font-size="18" font-family="ApfelMittel" fill="#ECEAE4">and reuse for the people</text><text y="98.2" font-size="18" font-family="ApfelMittel" fill="#ECEAE4">building pages and doing</text><text y="118.9" font-size="18" font-family="ApfelMittel" fill="#ECEAE4">comms, without relying on</text><text y="139.6" font-size="18" font-family="ApfelMittel" fill="#ECEAE4">tagging at capture?</text></g>
<g class="node" data-num="1" data-depth="1" transform="translate(341.3,0)"><text y="17.7" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">1 Is finding media actually a real</text><text y="42.4" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">constraint on site and comms</text><text y="67.1" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">work, and where does it bite?</text></g>
<g class="node" data-num="2" data-depth="1" transform="translate(341.3,94)"><text y="17.7" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">2 Who does the hunting</text><text y="42.4" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">today, and what do</text><text y="67.1" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">they need in practice?</text></g>
<g class="node" data-num="2.1" data-depth="2" transform="translate(654.9,97.9)"><text y="15.8" font-size="17" fill="#ECEAE4">2.1 Which live pages and</text><text y="37.9" font-size="17" fill="#ECEAE4">comms pieces need what</text><text y="60" font-size="17" fill="#ECEAE4">media first (Hubs site first)?</text></g>
<g class="node" data-num="3" data-depth="1" transform="translate(341.3,188)"><text y="17.7" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">3 Where does our</text><text y="42.4" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">material live today? (Drive</text><text y="67.1" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">partly surveyed in Sept)</text></g>
<g class="node" data-num="3.1" data-depth="2" transform="translate(654.9,191.9)"><text y="15.8" font-size="17" fill="#ECEAE4">3.1 Who knows or controls each</text><text y="37.9" font-size="17" fill="#ECEAE4">location, and who can actually</text><text y="60" font-size="17" fill="#ECEAE4">get material out for us?</text></g>
<g class="node" data-num="4" data-depth="1" transform="translate(341.3,293)"><text y="17.7" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">4 Should findable</text><text y="42.4" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">material be moved into</text><text y="67.1" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">one archive, or pointed</text><text y="91.8" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">to where it already lives?</text></g>
<g class="node" data-num="5" data-depth="1" transform="translate(341.3,411.7)"><text y="17.7" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">5 What must we know</text><text y="42.4" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">about each asset, and how</text><text y="67.1" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">do we tell what's "strong"</text><text y="91.8" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">without tagging at capture?</text></g>
<g class="node" data-num="5.1" data-depth="2" transform="translate(654.9,411.9)"><text y="15.8" font-size="17" fill="#ECEAE4">5.1 What is the minimum to record</text><text y="37.9" font-size="17" fill="#ECEAE4">(source, date, used where)?</text></g>
<g class="node" data-num="5.2" data-depth="2" transform="translate(654.9,466.1)"><text y="15.8" font-size="17" fill="#ECEAE4">5.2 Can use, a quick human</text><text y="37.9" font-size="17" fill="#ECEAE4">pick, or AI signal "strong"?</text></g>
<g class="node" data-num="6" data-depth="1" transform="translate(341.3,530.4)"><text y="17.7" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">6 How will we know the</text><text y="42.4" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">first attempt worked well</text><text y="67.1" font-size="19" font-family="ApfelMittel" fill="#ECEAE4">enough to continue?</text></g>
