<g class="node" data-num="root" data-depth="0" transform="translate(0,488.2)"><text y="29.4" font-size="35" font-family="ApfelMittel" fill="#ECEAE4">How should we</text><text y="68.6" font-size="35" font-family="ApfelMittel" fill="#ECEAE4">approach the</text><text y="107.8" font-size="35" font-family="ApfelMittel" fill="#ECEAE4">development of AI</text><text y="147" font-size="35" font-family="ApfelMittel" fill="#ECEAE4">wisely, and what do</text><text y="186.2" font-size="35" font-family="ApfelMittel" fill="#ECEAE4">wisdom traditions offer?</text></g>
<g class="node" data-num="1" data-depth="1" data-hidden="21" transform="translate(540.6,0)"><text y="27.6" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">Alignment is still a shot</text><text y="65.4" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">in the dark.</text><text class="more" x="162" y="65.4" font-size="22" font-family="ApfelMittel" fill="#F28B6E">+21</text></g>
<g class="node" data-num="2" data-depth="1" data-hidden="17" transform="translate(540.6,113.5)"><text y="27.6" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">Go at the speed of wisdom.</text><text y="65.4" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">We should slow and steer the</text><text y="103.2" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">frontier: pace capability gains</text><text y="141.1" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">to the speed at which we can</text><text y="178.9" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">understand, verify and</text><text y="216.7" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">govern them, and put safety,</text><text y="254.5" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">verification and defence</text><text y="292.3" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">ahead of raw capability.</text><text class="more" x="324.7" y="292.3" font-size="22" font-family="ApfelMittel" fill="#5EC4C0">+17</text></g>
<g class="node" data-num="3" data-depth="1" data-hidden="34" transform="translate(540.6,453.8)"><text y="27.6" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">AI's deepest everyday effect is</text><text y="65.4" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">on our capacity to choose well,</text><text y="103.2" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">as individuals and as societies:</text><text y="141.1" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">to attend, think, judge and</text><text y="178.9" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">relate for ourselves, and to</text><text y="216.7" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">govern ourselves together.</text><text class="more" x="372.8" y="216.7" font-size="22" font-family="ApfelMittel" fill="#A8C65A">+34</text></g>
<g class="node" data-num="4" data-depth="1" data-hidden="17" transform="translate(540.6,718.6)"><text y="27.6" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">We do not know whether any</text><text y="65.4" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">current AI has experience, we</text><text y="103.2" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">have no agreed way to find</text><text y="141.1" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">out, and we may never get one;</text><text y="178.9" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">so the wise stance is calibrated</text><text y="216.7" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">agnosticism plus cheap,</text><text y="254.5" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">proportionate precaution,</text><text y="292.3" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">honesty with users that does</text><text y="330.2" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">not invite over-attribution, and</text><text y="368" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">close attention to what our way</text><text y="405.8" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">of relating to these systems</text><text y="443.6" font-size="31" font-family="ApfelMittel" fill="#ECEAE4">does to us.</text><text class="more" x="159.1" y="443.6" font-size="22" font-family="ApfelMittel" fill="#C59BE8">+17</text></g>
</g>
</svg>
