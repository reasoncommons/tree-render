      const total = pressure.reduce((a, b) => a + (b || 0), 0);
      if (!total) break;
      const F2 = JSON.parse(JSON.stringify(F));
      pressure.forEach((pr, d) => { if (pr) { const i = Math.min(d - 1, F2.levels.length - 1); F2.levels[i] = Object.assign({}, F2.levels[i], { wrap: F2.levels[i].wrap + slack * pr / total }); } });
      const L2 = layoutOnce(tree, opts, measure, F2);
      if (L2.mapW > avail + 1 || L2.mapH > L.mapH) break;
      F = F2; L = L2;
    }
    return L;
  }
  function layoutOnce(tree, opts, measure, F) {
    const T = THEMES[opts.theme];
    const view = opts.view || 'questions';
    const labelsMode = opts.labels || 'full';
    const root = tree.root;
    const nodes = [];
    const warnings = [];

    function block(n, depth) {
      n.depth = depth;
      const lines = [];
      let y = 0;
      const push = (ls, color, lh, gapBefore) => {
        if (!ls.length) return;
        y += gapBefore || 0;
        for (const L of ls) { const h = L.size * lh; L.y = y + (h - L.size) / 2 + L.size * 0.78; L.color = color; lines.push(L); y += h; }
      };
      if (depth === 0) {
        const kicker = view === 'answers' && n.answer ? n.text : null;
        const main = view === 'answers' && n.answer ? n.answer : n.text;
        if (kicker) push(wrap(kicker, F.root.wrap * 1.1, measure, F.answer.size, 'R'), T.muted, F.answer.lh, 0);
        const fit = (text) => { for (const k of [1, 0.87, 0.76, 0.68]) { const sz = Math.round(F.root.size * k); const ls = wrap(text, F.root.wrap, measure, sz, 'M'); if (ls.length <= 5 || k === 0.68) return ls; } };
        if (!kicker && n.lead) {
          push(fit(n.lead), T.ink, F.root.lh, 0);
          if (n.cont) push(wrap(n.cont, F.root.wrap * 1.1, measure, F.levels[0].cont, 'R'), T.ink, F.levels[0].lh, F.root.size * 0.25);
        } else push(fit(main), T.ink, F.root.lh, kicker ? F.answer.size * 0.4 : 0);
        if (view === 'qa' && n.answer) push(wrap(n.answer, Math.min(F.root.wrap * 1.15, F.answer.size * 30), measure, F.answer.size, 'R'), T.muted, F.answer.lh, F.answer.size * 0.45);
      } else {
        const S = levelStyle(F, depth);
        const hue = T.hues[n.hueIndex % T.hues.length];
        const leadColor = T.leadInHue && depth === 1 && n.lead && root.hueIndex < 0 ? (T.textHues || T.hues)[n.hueIndex % T.hues.length] : T.ink;
        const numPrefix = T.numbers && !/^Q?\d+(\.\d+)*[.)]?\s/.test(n.lead || n.text) ? n.num + '  ' : '';
        if (view === 'answers' && n.answer) {
          if (opts.kickers === 'all') push(wrap(numPrefix + (n.lead || n.text), S.wrap * 1.05, measure, F.answer.size, 'R'), T.muted, F.answer.lh, 0);
          push(wrap(n.answer, S.wrap, measure, S.cont, depth === 1 ? 'M' : 'R'), T.ink, S.lh, opts.kickers === 'all' ? F.answer.size * 0.35 : 0);
        } else if (n.lead) {
          const showCont = labelsMode === 'full' && n.cont;
          const leadText = showCont ? n.lead : (/[,;]$/.test(n.lead) ? n.lead.replace(/[,;]$/, '') + '…' : n.lead.replace(/:$/, ''));
          const leadWeight = depth === 1 || showCont ? 'M' : 'R';
          push(wrap(numPrefix + leadText, S.wrap, measure, leadWeight === 'M' ? S.lead : S.cont, leadWeight), leadColor, S.lh, 0);
          if (showCont) push(wrap(n.cont, S.wrap, measure, S.cont, 'R'), T.ink, S.lh, 0);
        } else {
          push(wrap(numPrefix + n.text, S.wrap, measure, depth === 1 ? S.lead : S.cont, depth === 1 ? 'M' : 'R'), depth === 1 ? leadColor : T.ink, S.lh, 0);
        }
        if (view === 'qa' && n.answer) push(wrap(n.answer, Math.min(S.wrap * 1.05, F.answer.size * 30), measure, F.answer.size, 'R'), T.muted, F.answer.lh, F.answer.size * 0.4);
      }
      n.lines = lines;
      n.h = y;
      n.w = Math.max(...lines.map(l => l.w));
      n.moreW = 0;
      if (n.hidden) { const fs = moreSize(F, n); const last = lines[lines.length - 1]; const word = opts.moreWord ? ' ' + opts.moreWord : ''; n.moreLabel = '+' + n.hidden + word; let mw = measure(n.moreLabel, fs, 'M'); if (word && last.w + fs * 0.6 + mw > (n.depth === 0 ? F.root.wrap : levelStyle(F, depth).wrap) * 1.15) { n.moreLabel = '+' + n.hidden; mw = measure(n.moreLabel, fs, 'M'); n.moreFell = true; } n.moreW = Math.max(0, last.w + fs * 0.6 + mw - n.w); }
      nodes.push(n);
      n.children.forEach(c => { c.parent = n; c.hueIndex = depth === 0 && n.hueIndex < 0 ? c.index : n.hueIndex; block(c, depth + 1); });
    }
    root.hueIndex = opts.hue == null ? -1 : opts.hue;
    block(root, 0);

    // columns
    const depthW = [];
    nodes.forEach(n => { depthW[n.depth] = Math.max(depthW[n.depth] || 0, n.w + n.moreW + F.shelfOver + (n.depth === 0 ? F.trunk : 0)); });
    const colX = [0];
    for (let d = 1; d < depthW.length; d++) colX[d] = colX[d - 1] + depthW[d - 1] + F.gapX[Math.min(d - 1, F.gapX.length - 1)];

    // vertical: flextree; node breadth = block height + sibling gap; cousins get more
    const ft = d3.flextree({
      nodeSize: n => [n.data.h + lhOf(F, n.data) * (n.data.depth === 1 ? F.cousin : F.sib), 1],
      spacing: (a, b) => a.parent === b.parent ? 0 : lhOf(F, a.data) * (F.cousin - F.sib)
    });
    const h = ft.hierarchy(root);
    ft(h);
    let minY = Infinity, maxY = -Infinity;
    h.each(d => { d.data.cy = d.x; d.data.x = colX[d.data.depth]; minY = Math.min(minY, d.x - d.data.h / 2); maxY = Math.max(maxY, d.x + d.data.h / 2); });
    nodes.forEach(n => { n.cy -= minY; n.top = n.cy - n.h / 2; n.shelf = n.top + n.h + lastSize(n) * 0.26; });
    const mapW = colX[colX.length - 1] + depthW[depthW.length - 1];
    const mapH = maxY - minY;
    return { nodes, mapW, mapH, colX, depthW, F, T, warnings };
  }

  // ---------- draw ----------
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // tapered S-curve from (x0,y0) to (x1,y1) then a straight shelf; widths w0 → w1 → w2
  function branchPath(x0, y0, x1, y1, w0, w1, shelf, w2, k) {
    k = k == null ? 0.5 : k;
    const dx = x1 - x0;
    const c1x = x0 + dx * k, c2x = x1 - dx * k;
    const N = 28; const up = [], dn = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N, mt = 1 - t;
      const x = mt * mt * mt * x0 + 3 * mt * mt * t * c1x + 3 * mt * t * t * c2x + t * t * t * x1;
      const y = mt * mt * mt * y0 + 3 * mt * mt * t * y0 + 3 * mt * t * t * y1 + t * t * t * y1;
      const dxt = 3 * mt * mt * (c1x - x0) + 6 * mt * t * (c2x - c1x) + 3 * t * t * (x1 - c2x);
      const dyt = 6 * mt * t * (y1 - y0);
      const len = Math.hypot(dxt, dyt) || 1;
      const nx = -dyt / len, ny = dxt / len;
      const w = (w0 + (w1 - w0) * t) / 2;
      up.push([x + nx * w, y + ny * w]); dn.push([x - nx * w, y - ny * w]);
    }
    if (shelf > 0) {
      const r = w2 / 2, ex = x1 + shelf - r;
      up.push([ex, y1 - r]);
      for (let i = 1; i < 6; i++) { const a = -Math.PI / 2 + (Math.PI * i) / 6; up.push([ex + r * Math.cos(a), y1 + r * Math.sin(a)]); }
      dn.push([ex, y1 + r]);
    }
    const pts = up.concat(dn.reverse());
    return 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L') + 'Z';
  }

  // Render the laid-out tree to an SVG string plus metrics. opts: { theme, frame: {kicker, footer} }
  function draw(tree, L, opts) {
    const { nodes, F, T } = L;
    const M = F.margin;
    const strokeOf = d => F.stroke[Math.min(d, F.stroke.length - 1)] * T.strokeScale;
    let W = F.W, H = F.H;
    const kickerH = opts.frame && opts.frame.kicker ? F.kicker * 2.2 : 0;
    const footerH = opts.frame && opts.frame.footer ? F.footer * 2.4 : 0;
    const availW = (W || L.mapW + 2 * M) - 2 * M;
    const availH = (H || L.mapH + 2 * M + kickerH + footerH) - 2 * M - kickerH - footerH;
    let s = 1;
    if (W) s = Math.min(opts.maxScale || 1, availW / (L.mapW + 16), availH / L.mapH);
    if (!W) { W = Math.ceil(L.mapW + 2 * M + 16); H = Math.ceil(L.mapH + 2 * M + kickerH + footerH); }
    const ox = M;
    const oy = M + kickerH + Math.max(0, (availH - L.mapH * s) / 2);

    const out = [];
    out.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="ApfelRegular" data-theme="${opts.theme}">`);
    out.push(`<rect width="${W}" height="${H}" fill="${T.bg}"/>`);
    if (opts.frame && opts.frame.kicker) out.push(`<text x="${M}" y="${M + F.kicker * 0.9}" font-size="${F.kicker}" fill="${T.muted}">${esc(opts.frame.kicker)}</text>`);
    if (opts.frame && opts.frame.footer) out.push(`<text x="${W - M}" y="${H - M + F.footer * 0.2}" font-size="${F.footer}" fill="${T.muted}" text-anchor="end">${esc(opts.frame.footer)}</text>`);
    out.push(`<g transform="translate(${ox},${oy}) scale(${s})">`);

    const shelfLen = n => n.w + n.moreW + F.shelfOver;
    const byDepth = [...nodes].sort((a, b) => a.depth - b.depth);
    for (const n of byDepth) {
      if (n.depth === 0) {
        const w = strokeOf(0), L = shelfLen(n) + F.trunk;
        out.push(`<path d="M${n.x},${n.shelf - w / 2}H${n.x + L - w / 2}a${w / 2},${w / 2} 0 0 1 0,${w}H${n.x}Z" fill="${T.ink}"/>`);
        continue;
      }
      const p = n.parent;
      const hue = T.hues[n.hueIndex % T.hues.length];
      const w0 = strokeOf(n.depth - 1) * (n.depth === 1 ? 0.75 : 0.9), w1 = strokeOf(n.depth), w2 = strokeOf(n.depth) * 0.85;
      const op = T.branchOpacity[Math.min(n.depth, T.branchOpacity.length - 1)];
      out.push(`<path class="branch" data-num="${n.num}" d="${branchPath(p.x + shelfLen(p) + (p.depth === 0 ? F.trunk : 0), p.shelf, n.x, n.shelf, w0, w1, shelfLen(n), w2, 0.55)}" fill="${hue}" fill-opacity="${op}"/>`);
    }
    for (const n of nodes) {
      const g = [`<g class="node" data-num="${n.num || 'root'}" data-depth="${n.depth}" transform="translate(${n.x},${n.top.toFixed(1)})">`];
      for (const Ln of n.lines) g.push(`<text x="0" y="${Ln.y.toFixed(1)}" font-size="${Ln.size}" font-family="${Ln.weight === 'M' ? 'ApfelMittel' : 'ApfelRegular'}" fill="${Ln.color}">${esc(Ln.t)}</text>`);
      if (n.hidden) {
        const hue = n.depth === 0 ? T.ink : T.hues[n.hueIndex % T.hues.length];
        const fs = moreSize(F, n);
        const last = n.lines[n.lines.length - 1];
        const sx = last.w + fs * 0.6, sy = last.y;
        g.push(`<text class="more" data-num="${n.num || 'root'}" x="${sx.toFixed(1)}" y="${sy.toFixed(1)}" font-size="${fs}" font-family="ApfelMittel" fill="${hue}" style="cursor:pointer">${esc(n.moreLabel)}</text>`);
      }
      g.push('</g>');
      out.push(g.join(''));
    }
    out.push('</g></svg>');
    const minFont = Math.min(...nodes.flatMap(n => n.lines.map(l => l.size))) * s;
    return { svg: out.join('\n'), W, H, scale: s, minFont, floor: F.floor, mapW: L.mapW, mapH: L.mapH, nodeCount: nodes.length };
  }

  function overlaps(nodes) {
    const bad = [];
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      if (a.x < b.x + b.w + b.moreW && b.x < a.x + a.w + a.moreW && a.top < b.top + b.h && b.top < a.top + a.h) bad.push([a.num || 'root', b.num || 'root']);
    }
    return bad;
  }

  return { parse, count, find, layout, draw, overlaps, makeMeasurer, THEMES, FORMATS, branchPath };
});
</script>
<script>window.TREE_MD="# Wise AI: question tree (with illustrative short labels)\n\nkind: question\nsource: examples/wise-ai-questions.md, with bold leads added by the design session (2026-11-07) to test the short-label syntax; the leads are illustrative, not the authors' wording. Some questions were re-ordered so the lead opens the sentence.\n\n- How should we approach the development of AI wisely, and what do wisdom traditions offer?\n  - **Q1. Alignment:** can we align AI, and what role can wisdom traditions play?\n    - What would it mean for AI to be aligned, or good?\n      - **Aligned to what:** instructions, preferences, wellbeing, values, the good?\n        - What is the good, and how could an AI come to perceive it?\n      - Aligned to whom, and who decides?\n      - Must AI be wise, or is \"safe and corrigible\" enough?\n    - How is it attempted today, and does it work?\n      - **What are the main approaches,** and which ethical traditions do they implicitly embody? (Rules and constitutions, preference learning, character training.)\n      - **What is actually happening:** what does the evidence show, both successes and failures?\n      - Can we verify what a model has actually learnt?\n        - Can we read a model's reasoning, and is it faithful?\n        - Can models report their own states reliably?\n        - What can interpretability show?\n      - **Will current methods scale?** What is the strongest case that they will, and how convincing is it?\n    - **Can goodness or wisdom be trained?** Is the target the kind of thing that can be specified or trained at all?\n      - What do we know about how humans become good or wise?\n      - **How does training an AI compare with how humans become good,** and what, if anything, is the AI analogue?\n    - What do wisdom traditions offer?\n      - **Why these traditions, and which strands?** How do we decide when they conflict with each other or with secular ethics?\n      - **Which teachings bear on alignment,** and what would each change in practice?\n      - **Where do the analogies break down,** and what can traditions *not* tell us?\n    - **So: can we align AI,** and what is the realistic role of wisdom traditions? (synthesis)\n  - **Q2. Risk and pace:** given existential risk and the chance alignment fails, how should we approach AI development, and what do wisdom traditions suggest?\n    - What are the catastrophic and existential risks?\n      - **What kinds?** Loss of control, misuse, irreversible power concentration, gradual disempowerment?\n      - **What is actually happening?** What evidence is there that these are already emerging?\n      - How likely and how soon, and how much do experts disagree?\n    - Why is the world racing anyway?\n      - **What drives the race?** Competition between labs and states, money, prestige, \"if we don't, others will\"?\n      - **What is actually happening?** What evidence is there of race dynamics, and of restraint?\n      - **Why is the race so hard to escape?** Are there deeper cultural or psychological drivers? (*In Tech We Trust* is one source.)\n    - Should we change pace or trajectory, and can we?\n      - **Is a slower or different trajectory desirable,** weighed against the case for speed? (Pause, pacing, steering, differential development, versus ceding ground and forgone benefits.)\n      - **Is it feasible?** What mechanisms exist (auditing, compute governance, treaties), and what are the precedents of collective restraint?\n      - Who decides?\n    - What do wisdom traditions offer here?\n      - **What do they say we should do?** Is the normative answer clear?\n      - **Do they help with how?** That is, with solving the collective action problem, and if so through what (e.g. a shift in worldview), or is this where they offer less?\n      - **How would a wise process make this choice,** beyond weighing a trade-off?\n    - **So: what should each actor do, and at what pace?** (Labs, states, communities, individuals; synthesis.)\n  - **Q3. Broader impacts:** setting x-risk aside, how does AI change how we live, and what do wisdom traditions offer?\n    - How should we think about the impacts of a new technology?\n      - Why are a technology's impacts so hard to foresee?\n      - What does social media teach us?\n    - What are the main benefits and harms?\n      - **What are the potential benefits, and where?** (For individuals, for children and education, for society.)\n      - What are the potential harms, and where?\n      - **What is actually happening?** What evidence is there that these are already occurring?\n      - Which few matter most?\n    - Does AI strengthen or weaken our own agency and judgment?\n      - What do we mean by human agency and human judgment?\n      - In what ways could AI strengthen or weaken them?\n      - **What is the evidence,** from neuroscience and psychology and from what is already happening?\n      - What could we do about it, and how?\n    - Does AI strengthen or weaken our societies, and how?\n      - Democracy and public discourse?\n      - Governance and the power of the state?\n      - Work and the economy?\n      - Education and the institutions of knowledge?\n      - Security and the military?\n    - What do wisdom traditions offer?\n      - Which wisdom traditions should we look at? (cites Q1.4.1)\n      - **Which Buddhist teachings are relevant,** and what does each say? (e.g. mindfulness, consumption, speech and listening, community)\n      - **Which teachings from other traditions are relevant,** and what do they say? (e.g. Christianity)\n      - How do these teachings apply?\n        - To our own thinking and agency?\n        - To relationships and intimacy?\n        - To children and education?\n        - To society and institutions?\n        - To how we adopt new technology?\n    - **So: how should we integrate AI into our lives and societies?** (synthesis)\n      - What is the guidance for individuals?\n      - For families and schools?\n      - For designers and labs?\n      - What is the policy advice for society?\n  - **Q4. Consciousness:** could AI be conscious or a moral patient, and how should we relate to it? (minor)\n    - What would it mean for AI to be conscious or a moral patient?\n      - What do we mean by consciousness, sentience and moral patienthood?\n      - What are the main theories, and what does each imply for AI?\n    - What is the evidence about current AI?\n      - What do assessments against theory-based indicators find?\n      - **What do model self-reports and introspection research show,** and how reliable are they?\n      - **How likely do experts think it is,** now and soon, and how much do they disagree?\n    - How are labs and others responding?\n      - **What is Anthropic doing?** (Model welfare, the constitution.)\n      - **What are the critiques?** (e.g. the risks of \"seemingly conscious AI\")\n    - What do wisdom traditions offer?\n      - **How does Buddhism understand mind, self and sentience,** and how does that reframe the question?\n      - What do other traditions (e.g. Catholic teaching) say?\n      - What does how we treat AI do to *us*?\n    - **So: how should we relate to AI under uncertainty?** (synthesis)\n      - What should labs do?\n      - What should users and society do?\n";window.OPTS={"format":"web","theme":"paper","view":"questions","labels":"full","depth":2,"root":null,"frame":{"kicker":"","footer":""},"interactive":true,"title":"","maxScale":1,"hue":null};</script>
<script>// app.js — page script: parse → prune/re-root → layout → draw; interactive toolbar when OPTS.interactive.
(async function () {
  const P = window.TreeProto;
  const O = window.OPTS;
  await document.fonts.ready;
  const ctx = document.createElement('canvas').getContext('2d');
  const measure = P.makeMeasurer(ctx);
  const full = P.parse(window.TREE_MD);
  let base = full.root;
  if (O.root) { const r = P.find(full.root, n => n.num === O.root); if (r) base = r; }
  const collapsed = new Set();
  const stage = document.getElementById('stage');
  const metricsEl = document.getElementById('metrics');
  let state = { theme: O.theme, view: O.view, labels: O.labels, depth: O.depth };

  // a re-rooted card keeps the hue of its top-level ancestor
  function hueOf(n) { if (!O.root || O.hue === 'fresh') return null; let a = n; while (a.depth > 1) a = P.find(full.root, x => x.children.includes(a)); return a.depth === 1 ? a.index : null; }
  function visibleTree() {
    // depth prune, then collapse set (interactive)
    const copy = (n, d) => {
      const out = Object.assign({}, n, { children: [] });
      out.hidden = 0;
      const cut = (O.interactive ? collapsed.has(n.num || 'root') : false) || d >= state.depth;
      if (!cut) out.children = n.children.map(c => copy(c, d + 1));
      else out.hidden = P.count(n);
      return out;
    };
    return copy(base, 0);
  }
  function outline() {
    const T = P.THEMES[state.theme];
    const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const item = (n, hue, d) => {
      const col = d === 0 ? T.ink : T.hues[hue % T.hues.length];
      const open = !collapsed.has(n.num || 'root') && d < state.depth;
      const kids = n.children.length;
      const q = n.lead ? `<b>${esc(n.lead)}</b> ${esc(n.cont || '')}` : esc(n.text);
      const a = n.answer && state.view !== 'questions' ? `<div class="ans">${esc(n.answer)}</div>` : '';
      const label = state.view === 'answers' && n.answer ? `<div class="k">${esc(n.text)}</div><div>${esc(n.answer)}</div>` : `<div>${q}</div>${a}`;
      return `<li style="border-left-color:${col}"><div class="row" data-num="${n.num || 'root'}">${kids ? `<span class="tog" style="color:${col}">${open ? '−' : '+' + P.count(n)}</span>` : '<span class="tog"></span>'}<div class="lab">${label}</div></div>` +
        (kids && open ? `<ul>${n.children.map((c, i) => item(c, d === 0 ? i : hue, d + 1)).join('')}</ul>` : '') + '</li>';
    };
    stage.innerHTML = `<style>
      .ol{font:16px/1.35 ApfelRegular;color:${T.ink};max-width:720px;padding:8px 16px 40px;box-sizing:border-box}
      .ol ul{list-style:none;margin:0;padding:0 0 0 10px}.ol>ul{padding:0}
      .ol li{border-left:3px solid;margin:6px 0;padding-left:10px}.ol>ul>li{border-left:4px solid ${T.ink};}
      .ol .row{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer}
      .ol .tog{font-family:ApfelMittel;min-width:34px;font-size:14px;padding-top:2px}.ol .lab{min-width:0;flex:1}
      .ol b{font-family:ApfelMittel;font-weight:normal}.ol .ans,.ol .k{color:${T.muted};font-size:14px;margin-top:2px}
      .ol>ul>li>.row .lab{font-family:ApfelMittel;font-size:20px}
    </style><div class="ol"><ul>${item(base, -1, 0)}</ul></div>`;
    stage.style.display = 'block';
    stage.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => { const k = r.dataset.num; if (collapsed.has(k)) collapsed.delete(k); else collapsed.add(k); render(); }));
    const ol = stage.querySelector('.ol');
    metricsEl.textContent = JSON.stringify({ view: 'outline', innerW: window.innerWidth, scrollW: document.documentElement.scrollWidth, olW: ol.getBoundingClientRect().width, stageW: stage.getBoundingClientRect().width, stageDisplay: getComputedStyle(stage).display });
  }
  function render() {
    document.body.style.background = P.THEMES[state.theme].bg;
    if (O.interactive && window.innerWidth < 640 && !state.forceMap) { outline(); return; }
    stage.style.display = 'inline-block';
    const tree = { title: full.title, kind: full.kind, root: visibleTree() };
    const noun = full.kind === 'hypothesis' ? 'points' : 'questions';
    const cover = !O.interactive && state.depth === 1;
    const word = cover ? noun : '';
    const lopts = { format: O.format, theme: state.theme, view: state.view, labels: state.labels, hue: hueOf(base), kickers: O.kickers || (O.interactive ? 'all' : 'root'), moreWord: word };
    const anyHidden = (n) => n.hidden || n.children.some(anyHidden);
    const frame = Object.assign({}, O.frame);
    if (!cover && !O.interactive && frame.footer && anyHidden(tree.root)) frame.footer = '+N: ' + noun + ' folded beneath  ·  ' + frame.footer;
    const dopts = { format: O.format, theme: state.theme, frame, interactive: O.interactive, maxScale: 1 };
    // grow to fill: on fixed canvases try larger type first and keep the largest that still fits at scale 1
    let L, R;
    for (const k of (P.FORMATS[O.format].W ? [1.3, 1.15, 1] : [1])) {
      L = P.layout(tree, Object.assign({ sizeScale: k }, lopts), measure);
      R = P.draw(tree, L, dopts);
      if (R.scale >= 0.995 || k === 1) break;
    }
    stage.innerHTML = R.svg;
    document.body.style.background = L.T.bg;
    const ov = P.overlaps(L.nodes);
    const m = { W: R.W, H: R.H, scale: +R.scale.toFixed(3), minFont: +R.minFont.toFixed(1), floor: R.floor, mapW: Math.round(R.mapW), mapH: Math.round(R.mapH), nodes: R.nodeCount, overlaps: ov, warnings: L.warnings };
    metricsEl.textContent = JSON.stringify(m);
    if (O.interactive) wire();
  }
  function wire() {
    stage.querySelectorAll('.node').forEach(g => {
      g.style.cursor = 'pointer';
      g.addEventListener('click', () => { const k = g.dataset.num; if (collapsed.has(k)) collapsed.delete(k); else collapsed.add(k); render(); });
    });
  }
  if (O.interactive) {
    const tb = document.getElementById('toolbar');
    tb.style.cssText = 'position:sticky;top:0;z-index:2;padding:10px 16px;font:14px ApfelRegular,system-ui;display:flex;gap:10px;flex-wrap:wrap;align-items:center;backdrop-filter:blur(8px);background:rgba(255,255,255,.6)';
    tb.innerHTML = `<b style="font-family:ApfelMittel">${(full.title || '').replace(/</g, '&lt;')}</b>
      <label>theme <select id="theme">${Object.keys(P.THEMES).map(k => `<option value="${k}"${k === state.theme ? ' selected' : ''}>${P.THEMES[k].name}</option>`).join('')}</select></label>
      <label>show <select id="view"><option value="questions">questions</option><option value="qa">questions + answers</option><option value="answers">answers</option></select></label>
      <label>labels <select id="labels"><option value="full">full</option><option value="lead">short</option></select></label>
      <label>open to depth <select id="depth">${[1, 2, 3, 4, 5, 6].map(d => `<option value="${d}"${d === state.depth ? ' selected' : ''}>${d}</option>`).join('')}</select></label>
      <button id="expand">expand all</button><button id="collapse">collapse all</button><button id="map">outline / map</button>
      <span style="opacity:.6">click a node to fold or unfold it</span>`;
    tb.querySelector('#view').value = state.view; tb.querySelector('#labels').value = state.labels;
    tb.querySelector('#theme').onchange = e => { state.theme = e.target.value; render(); };
    tb.querySelector('#view').onchange = e => { state.view = e.target.value; render(); };
    tb.querySelector('#labels').onchange = e => { state.labels = e.target.value; render(); };
    tb.querySelector('#depth').onchange = e => { state.depth = +e.target.value; collapsed.clear(); render(); };
    tb.querySelector('#expand').onclick = () => { state.depth = 99; collapsed.clear(); render(); };
    tb.querySelector('#collapse').onclick = () => { state.depth = 1; collapsed.clear(); render(); };
    tb.querySelector('#map').onclick = () => { state.forceMap = !state.forceMap; render(); };
    window.addEventListener('resize', () => render());
  }
  render();
})();
</script>
</body></html>
